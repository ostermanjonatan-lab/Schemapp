<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#331b3f">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<title>Schemapp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style id="app-style">
/* Layout: one narrow column (max 34rem), plum header band, bottom tab bar; works down to the ~300px cover screen of a flip phone */
/* Palette: plum #331B3F (ink, header, actions), sage #ACC7B4 (highlights), ochre #E3A33B (accent: now, today, live) */
:root {
  --bg: #eef3ef;
  --surface: #ffffff;
  --ink: #331b3f;
  --muted: #6c5d73;
  --line: #d5e2d8;
  --accent: #331b3f;
  --accent-ink: #ffffff;
  --accent-soft: #dde9e0;
  --sage: #acc7b4;
  --sage-ink: #331b3f;
  --hl: #e3a33b;
  --hl-ink: #8a5a0e;
  --head-bg: #331b3f;
  --head-ink: #f4eef6;
  --head-line: rgba(255, 255, 255, 0.18);
  --live: #2d6e4a;
  --live-soft: #d9ebdf;
  --warn: #8f4f12;
  --warn-soft: #f8e8cf;
  --bar-off: #e6ece7;
  --red: #b02a42;
  --red-soft: #f8e1e5;
  --font-display: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: var(--font-body);
  --radius: 14px;
  /* Type scale: five sizes only. */
  --fs-xs: 0.75rem;
  --fs-sm: 0.8125rem;
  --fs-md: 0.9375rem;
  --fs-lg: 1.125rem;
  --fs-xl: 1.375rem;
  /* Spacing: between sections, and inside a section. */
  --space-section: 24px;
  --space-inner: 10px;
  --nav-h: 60px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #170d1c; --surface: #23152b; --ink: #efe9f1; --muted: #b4a7ba; --line: #3a2a44;
    --accent: #acc7b4; --accent-ink: #331b3f; --accent-soft: #2c3a31; --sage: #acc7b4; --sage-ink: #331b3f;
    --hl: #e8b04d; --hl-ink: #f0c26a; --head-bg: #331b3f; --head-ink: #f4eef6; --head-line: rgba(255, 255, 255, 0.16);
    --live: #9fd3ae; --live-soft: #22382a; --warn: #f0b259; --warn-soft: #3a2a12; --bar-off: #33243c; --red: #ff8b9c; --red-soft: #3d1b26; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #170d1c; --surface: #23152b; --ink: #efe9f1; --muted: #b4a7ba; --line: #3a2a44;
  --accent: #acc7b4; --accent-ink: #331b3f; --accent-soft: #2c3a31; --sage: #acc7b4; --sage-ink: #331b3f;
  --hl: #e8b04d; --hl-ink: #f0c26a; --head-bg: #331b3f; --head-ink: #f4eef6; --head-line: rgba(255, 255, 255, 0.16);
  --live: #9fd3ae; --live-soft: #22382a; --warn: #f0b259; --warn-soft: #3a2a12; --bar-off: #33243c; --red: #ff8b9c; --red-soft: #3d1b26; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; }
.wrap {
  max-width: 34rem; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.mono { font-variant-numeric: tabular-nums; }
.sk-card { background: var(--surface); border-radius: var(--radius); padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; }
.sk-today { background: var(--sage); opacity: 0.55; padding: 22px 18px; gap: 14px; }
.sk { display: block; height: 12px; border-radius: 6px; background: var(--line); animation: sk-pulse 1.4s ease-in-out infinite; }
.sk-today .sk { background: rgba(51, 27, 63, 0.14); }
.sk.h { height: 18px; }
.sk.big { height: 52px; border-radius: 10px; }
.sk.dot { width: 20px; height: 20px; border-radius: 6px; }
.sk.w40 { width: 40%; } .sk.w45 { width: 45%; } .sk.w50 { width: 50%; } .sk.w55 { width: 55%; } .sk.w60 { width: 60%; } .sk.w70 { width: 70%; } .sk.w80 { width: 80%; } .sk.w90 { width: 90%; }
.sk-tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
@keyframes sk-pulse { 50% { opacity: 0.5; } }
@media (prefers-reduced-motion: reduce) { .sk { animation: none; } }

main { padding-top: calc(env(safe-area-inset-top, 0px) + 20px); padding-bottom: calc(var(--nav-h) + 24px); overflow-x: clip; }
main .wrap { display: flex; flex-direction: column; gap: var(--space-section); padding-block: 4px 8px; }
.view, .slide-body { display: flex; flex-direction: column; gap: var(--space-section); }
.week-sec { display: flex; flex-direction: column; gap: var(--space-inner); }

.example-note {
  background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-size: var(--fs-sm); line-height: 1.4;
}
.example-note button { background: none; border: 0; padding: 0; text-decoration: underline; color: inherit; font-weight: 600; cursor: pointer; }

/* Today card */
.today { background: linear-gradient(135deg, #a7c4af 0%, #b8ccbf 50%, #c8d3ce 100%); color: var(--sage-ink); border-radius: var(--radius); padding: 20px 18px 18px; display: flex; flex-direction: column; gap: 8px; }
/* Today's shift: same sage as today's row in the week, plum text in both themes. */
.today .eyebrow, .today .hint, .today .next, .today .next strong, .today .extra-line, .today .dayinfo, .today .big .sep,
.today .pill, .today .pill.live, .today .pill.soon, .today .pill.done, .today .pill.changed { color: var(--sage-ink); }
.today .eyebrow { font-size: var(--fs-sm); }
.today .big { font-size: clamp(2.2rem, 11.5vw, 3.4rem); white-space: nowrap; letter-spacing: -0.03em; }
.today .big.off { white-space: normal; }
.today .big-sub .big { display: flex; flex-direction: column; font-size: clamp(3rem, 19vw, 4.75rem); line-height: 0.95; letter-spacing: -0.04em; }
.today .big-sub .big .sep { display: none; }
/* The big times fade from plum to a lighter purple. */
.today .big-sub { background: linear-gradient(135deg, #331b3f 20%, #583870 100%); -webkit-background-clip: text; width: fit-content; background-clip: text; -webkit-text-fill-color: transparent; }
.today .big-sub:has(.big + .big) .big { flex-direction: row; gap: 0.25em; font-size: clamp(2rem, 10vw, 3rem); }
.today .big-sub:has(.big + .big) .big .sep { display: inline; }
.today .pill { font-size: var(--fs-md); font-weight: 700; }
.today .hint { opacity: 0.85; }
.today .next { border-top-color: rgba(51, 27, 63, 0.22); }
.eyebrow { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.big { font-weight: 700; font-size: clamp(1.8rem, 9.5vw, 2.7rem); letter-spacing: -0.025em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.big.off { letter-spacing: -0.015em; }
.big .sep { color: var(--muted); font-weight: 500; }
.big-sub { display: flex; flex-direction: column; gap: 2px; }
.today .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 4px; }
.today .meta { font-size: var(--fs-sm); color: var(--sage-ink); opacity: 0.75; font-variant-numeric: tabular-nums; }
.pill { font-size: var(--fs-md); font-weight: 600; }
.pill.live { color: var(--live); }
.pill.soon { color: var(--ink); }
.pill.done { color: var(--muted); font-weight: 500; }
.pill.note { color: var(--warn); }
.hint { color: var(--muted); font-size: var(--fs-sm); }
.next { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 10px; font-size: var(--fs-sm); color: var(--muted); }
.next strong { color: var(--ink); font-weight: 600; }

/* Section heads */
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sec-head h2 { font-weight: 700; font-size: var(--fs-lg); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.sec-head .sub { color: var(--muted); font-size: var(--fs-sm); }
.stepper { display: flex; gap: 6px; flex: none; }
.icon-btn { width: 36px; height: 36px; border-radius: 10px; border: 0; background: var(--accent-soft); display: grid; place-items: center; cursor: pointer; }
.icon-btn svg { width: 16px; height: 16px; stroke: var(--ink); }
.text-btn.keep-space, .icon-btn.keep-space { visibility: hidden; }
.icon-btn[data-act$="0"] svg { width: 19px; height: 19px; stroke: var(--ink); color: var(--ink); }
.text-btn { height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 0 12px; font-size: var(--fs-sm); font-weight: 600; cursor: pointer; }

/* Week list */
.week { list-style: none; margin: 0; padding: 0; border-bottom: 1px solid var(--line); }
.week li { display: grid; grid-template-columns: 3.6rem 1fr auto; align-items: center; gap: 10px; padding: 11px 8px; border-top: 1px solid var(--line); min-height: 52px; }
.week li.is-today, .week li.is-today:hover { background: var(--sage); color: var(--sage-ink); border-radius: 10px; border-top-color: transparent; }
.week li.is-today + li { border-top-color: transparent; }
.is-today .d-date { color: var(--sage-ink); font-weight: 700; }
.is-today .d-hrs, .is-today .d-time .lbl, .is-today .d-time .lbl.extra, .is-today .d-time .lbl.changed, .is-today .d-time .t.offtxt, .is-today .d-time .notetxt, .is-today .dayinfo { color: var(--sage-ink); }
.is-today .d-time .t { font-weight: 700; }
.week li.is-past { color: var(--muted); }
.d-name { font-weight: 600; font-size: var(--fs-md); line-height: 1.2; }
.d-date { color: var(--muted); font-size: var(--fs-xs); }
.is-today .d-name { color: var(--sage-ink); font-weight: 700; }
.d-time { display: flex; flex-direction: column; gap: 1px; }
.d-time .t { font-weight: 500; font-variant-numeric: tabular-nums; font-size: var(--fs-md); white-space: nowrap; }
.d-time .t.offtxt { font-family: var(--font-body); color: var(--muted); font-weight: 400; }
.d-time .lbl { font-size: var(--fs-xs); color: var(--muted); }
.d-time .notetxt { font-family: var(--font-body); color: var(--warn); font-weight: 600; font-size: var(--fs-md); }
.d-time .lbl.extra, .tt.extra { color: var(--accent); font-family: var(--font-body); font-weight: 500; }
.extra-line { font-size: var(--fs-sm); color: var(--accent); font-weight: 500; }
.d-hrs { font-size: var(--fs-sm); color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.week-sum { display: flex; justify-content: space-between; gap: 12px; padding: 0 4px; color: var(--muted); font-size: var(--fs-sm); }
.swipe-hint { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin: -8px 0 -10px; }
.oc-card .swipe-hint { margin-top: 0; }
.swipe-hint button { width: 32px; height: 24px; display: grid; place-items: center; background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink); opacity: 0.25; }
.swipe-hint button:active { opacity: 0.9; }
.swipe-hint svg { width: 14px; height: 14px; stroke: currentColor; }
.swipe-hint .dots { display: flex; gap: 18px; }
.swipe-hint .dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--ink); opacity: 0.13; transition: opacity 0.2s; }
.swipe-hint .dots span.on { opacity: 0.45; }
.week-sum strong { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip[aria-pressed] { min-height: 36px; padding: 6px 12px; font-size: var(--fs-sm); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.fav-scroll { overflow-x: auto; }
.favs { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: var(--fs-sm); }
.favs th, .favs td { padding: 7px 2px; text-align: center; border-top: 1px solid var(--line); }
.favs thead th { border-top: 0; font-weight: 600; color: var(--muted); line-height: 1.2; }
.favs thead th b { display: block; color: var(--ink); }
.favs tbody th { text-align: left; font-weight: 600; max-width: 5.5rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-left: 0; padding-right: 6px; }
.favs td[data-act] { cursor: pointer; }
.favs td span { display: block; line-height: 1.25; }
.favs td.off { color: var(--muted); }
.favs td.note { color: var(--warn); font-size: var(--fs-xs); }
.fav-sec { display: flex; flex-direction: column; gap: var(--space-inner); }
.fav-day { list-style: none; margin: 0; padding: 0; }
.fav-day li { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); cursor: pointer; }
.fav-day li:first-child { border-top: 0; }
.fav-day li:active { background: var(--accent-soft); }
.fav-day .fd-n { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fav-day .fd-you { color: var(--muted); font-weight: 400; }
.fav-day .fd-t { font-variant-numeric: tabular-nums; text-align: right; }
.fav-day .fd-t.off { color: var(--muted); }
.fav-day .fd-t.note { color: var(--warn); }
.favs tr.me th { color: var(--muted); }
.favs .cur { background: var(--accent-soft); }
.favs thead th.cur { color: var(--ink); }
.favs thead th.cur { border-radius: 8px 8px 0 0; }
.favs thead th.cur b { color: inherit; }
.favs tbody tr:last-child .cur { border-radius: 0 0 8px 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 10px; font-size: var(--fs-sm); }
.chip.me { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.chip em { font-style: normal; color: var(--warn); margin-left: 4px; }
.group-label { font-size: var(--fs-md); color: var(--ink); font-weight: 600; margin-bottom: 6px; }

/* Full rotation grid */

/* Settings */
.panel { border-top: 1px solid var(--line); padding: 16px 0 4px; display: flex; flex-direction: column; gap: 10px; }
.panel h3 { margin: 0; font-size: var(--fs-md); font-weight: 600; }
.pend-h { margin: 14px 0 0; font-size: var(--fs-md); font-weight: 600; }
.panel p { margin: 0; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: var(--fs-sm); }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; cursor: pointer; font-size: var(--fs-md); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.seg-ctl { display: flex; gap: 6px; flex-wrap: wrap; }
.seg-ctl button { min-width: 44px; padding: 0 12px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-family: var(--font-mono); font-weight: 600; cursor: pointer; }
.seg-ctl .theme-btn { height: auto; min-width: 84px; padding: 8px 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-family: var(--font-body); font-size: var(--fs-xs); }
.theme-btn svg { width: 22px; height: 22px; stroke: currentColor; }
.seg-ctl button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.drop { position: relative; border: 1.5px dashed var(--line); border-radius: 12px; padding: 18px 14px; text-align: center; color: var(--muted); font-size: var(--fs-sm); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop input[type=file] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 0; z-index: 1; }
.drop:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.msg { border-radius: 10px; padding: 10px 12px; font-size: var(--fs-sm); }
.msg.ok { background: var(--live-soft); color: var(--live); }
.msg.err { background: var(--warn-soft); color: var(--warn); }
.pend-sum { margin: 0; }
.pend-note { margin: 0; padding-top: 10px; border-top: 1px solid var(--line); }
.pend-note + .pend-note { border-top: 0; padding-top: 4px; }
.help summary { font-weight: 600; cursor: pointer; padding-bottom: 6px; }
.help ol { margin: 0; padding-left: 1.2rem; display: flex; flex-direction: column; gap: 6px; font-size: var(--fs-sm); }
.help code { font-size: 0.85em; background: var(--bar-off); padding: 1px 5px; border-radius: 4px; }

/* Profile picker */
.picker { display: flex; flex-direction: column; gap: 14px; padding-block: 8px; }
.picker h1 { font-size: clamp(1.4rem, 7vw, 1.9rem); margin: 0; letter-spacing: -0.015em; text-wrap: balance; }
.picker p { margin: 0; color: var(--muted); }
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 9.5rem), 1fr)); gap: 8px; }
.person { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; text-align: left; min-height: 52px; }
.person .initials { width: 32px; height: 32px; border-radius: 50%; background: var(--sage); color: var(--sage-ink); display: grid; place-items: center; font-weight: 600; font-size: var(--fs-sm); flex: none; }
.person span:last-child { min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
.person[aria-current="true"] { border-color: var(--accent); }

/* Bottom nav */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
nav.tabs .wrap { display: grid; grid-template-columns: repeat(3, 1fr); height: var(--nav-h); }
nav.tabs button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: var(--fs-xs); font-weight: 500; color: var(--muted); cursor: pointer; padding: 0; }
nav.tabs svg { width: 20px; height: 20px; stroke: currentColor; }
nav.tabs button { position: relative; min-width: 0; }
nav.tabs button span { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: min(var(--fs-xs), 3.2vw); }
nav.tabs button[aria-current="page"] { color: var(--accent); font-weight: 600; }
nav.tabs button[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; border-radius: 0 0 3px 3px; background: var(--hl); }


/* Red days, changes */
.dayinfo { display: inline-block; font-size: var(--fs-xs); font-weight: 600; line-height: 1.3; }
.dayinfo.red { color: var(--red); }
.dayinfo.eve, .dayinfo.klam { color: var(--hl-ink); }
.eyebrow .dayinfo { font-size: inherit; }
.sec-head .dayinfo { margin-top: 2px; }
.week li.red .d-name { color: var(--red); }
.week li[data-act] { cursor: pointer; }
@media (hover: hover) { .week li[data-act]:hover { background: var(--accent-soft); } }
.week li:focus-visible { outline: 2px solid var(--hl); outline-offset: -2px; }
.d-time .lbl.changed { color: var(--hl-ink); font-weight: 600; }
.pill.changed { color: var(--warn); }
button.chip { font: inherit; font-size: var(--fs-sm); color: var(--ink); cursor: pointer; }

/* Open / close */
.oc { display: flex; flex-direction: column; gap: var(--space-inner); }
.oc-list { list-style: none; margin: 0; padding: 0; }
.oc-list li { display: grid; grid-template-columns: 4.6rem 3.4rem 1fr; align-items: baseline; gap: 8px; padding: 8px 4px; border-top: 1px solid var(--line); }
.oc-list li:last-child { border-bottom: 1px solid var(--line); }
/* On Mitt schema: a white card, rows divided by a thin line only between them. */
.oc-card { background: var(--surface); border-radius: var(--radius); padding: 16px 16px 6px; gap: 6px; box-shadow: 0 1px 2px rgba(51, 27, 63, 0.06); }
.oc-card .oc-list li, .oc-card .oc-list li:last-child { padding: 6px 0; border: 0; }
.oc-card .oc-t { font-size: var(--fs-lg); }
/* Den här veckan and Avdelningskollegor on Mitt schema: white cards like Öppning och stängning. */
.home-card { background: var(--surface); border-radius: var(--radius); padding: 16px; box-shadow: 0 1px 2px rgba(51, 27, 63, 0.06); overflow: hidden; }
.home-card .week { border-bottom: 0; }
/* Den här veckan is green in both themes; the variables restyle everything inside. */

.plan-btn { font: inherit; font-size: var(--fs-sm); font-variant-numeric: tabular-nums; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-height: 40px; padding: 0 10px 0 12px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }

/* A setting with a few choices: name on the left, the choices on the right. */

    for (i = a.attributes.length - 1; i >= 0; i--) { at = a.attributes[i].name; if (!b.hasAttribute(at)) a.removeAttribute(at); }
    for (i = 0; i < b.attributes.length; i++) { at = b.attributes[i]; if (a.getAttribute(at.name) !== at.value) a.setAttribute(at.name, at.value); }
    var tag = a.nodeName;
    if (tag === "INPUT" || tag === "TEXTAREA") {
      // A field being typed in keeps what is typed; others show what the page says.
      var v = tag === "TEXTAREA" ? b.textContent : (b.getAttribute("value") || "");
      if (a !== document.activeElement && a.value !== v) a.value = v;
      if (tag === "TEXTAREA") { if (a.textContent !== b.textContent) a.textContent = b.textContent; if (a !== document.activeElement) a.value = v; }
      return;
    }
    patchChildren(a, b);

  function render() {

    else {

      if (needPick && state.view !== "settings") html += renderPicker(me);
      else if (state.view === "grid") html += renderPeople(me);
      else if (state.view === "settings") html += renderSettings(me);
      else html += renderHome(me);
      html += "</div></main>";
      if (!empty && (!needPick || state.view === "settings")) html += renderNav();
    }
    if (state.edit) { html += renderEditor(me); state.edit.fresh = false; }
    else if (state.person) { html += renderPersonSheet(me); state.person.fresh = false; }
    if (state.planOpen && state.view === "settings") html += renderPlanPop();
    if (state.deptPop) html += renderDeptPop();

    if (state.absPop && state.report && state.view === "grid") html += renderAbsPop();
    var focusId = document.activeElement && document.activeElement.id;
    var oldDeck = document.getElementById("deck"), deckTop = oldDeck ? oldDeck.scrollTop : 0;
    var oldSheet = app.querySelector(".sheet"), sheetTop = oldSheet ? oldSheet.scrollTop : 0, sheetKind = state.edit ? "edit" : state.person ? "person" : "";
    morph(app, html);
    var newDeck = document.getElementById("deck");

    }

    }
    if (slideDir) { var sc = slideDir > 0 ? "from-r" : "from-l"; app.querySelectorAll(slideSel).forEach(function (el) { el.classList.add(sc); if (slideFar) el.classList.add("far"); }); slideDir = 0; }
    slideFar = false; slideSel = "[data-slide]";

  function filterPicker(q) { filterList(q, ".picker .plist", "pick-none"); }
  function filterList(q, listSel, noneId) {

    app.querySelectorAll(listSel + " .pgroup").forEach(function (g) { g.hidden = !g.querySelector("li:not([hidden])"); });

  function nowMinutes() { var n = new Date(); return n.getHours() * 60 + n.getMinutes(); }

  function statusFor(person, d) {
    // Returns a pill for today's shift, including a night shift that started yesterday.
    var now = nowMinutes();
    var y = shiftOn(person, addDays(d, -1));
    for (var i = 0; i < y.ranges.length; i++) {
      if (y.ranges[i].e > 1440 && now < y.ranges[i].e - 1440) return { cls: "live", text: "Nattpass till " + hhmm(y.ranges[i].e), s: y.ranges[i].s - 1440, e: y.ranges[i].e - 1440 };
    }
    var sh = shiftOn(person, d);
    for (var j = 0; j < sh.ranges.length; j++) {
      var r = sh.ranges[j];
      if (now >= r.s && now < r.e) return { cls: "live", text: "Pågår till " + hhmm(r.e), s: r.s, e: r.e };
      if (now < r.s) return { cls: "soon", text: "Börjar om " + untilText(r.s - now) };
    }
    if (sh.kind === "work") return { cls: "done", text: "Klar för idag" };
    return null;
  }

  function nextShift(person, from) {
    for (var i = 1; i <= DATA.weeks * 7; i++) {
      var d = addDays(from, i), sh = shiftOn(person, d);
      if (sh.kind === "work") return { d: d, sh: sh, i: i };
    }
    return null;
  }

  function dayLabelHtml(d) {
    var info = dayInfo(d);
    return info ? '<span class="dayinfo ' + info.type + '">' + esc(info.name) + "</span>" : "";
  }

  // Who opens and closes, for one day at a time. Swipe the card (or use the arrows) to see other days;
  // days when nobody works are skipped. Starts on the first working day from today.
  function ocDayFrom(off, dir) {
    var t = today();
    for (var i = 0; i < 21; i++, off += dir) if (openClose(addDays(t, off))) return off;
    return null;
  }
  function stepFav(n) {
    var next = ocDayFrom(state.favOffset + n, n);
    if (next == null) return;
    state.favOffset = next; slideSel = "[data-favslide]"; slideDir = n; render(); buzz();
  }
  function stepOc(n) {
    var next = ocDayFrom(state.ocOffset + n, n);
    if (next == null) return;
    state.ocOffset = next; slideSel = "[data-ocslide]"; slideDir = n; render(); buzz();
  }
  // Names wrap to two lines on some days. Give the list the height of the tallest day in the
  // rotation, so the card keeps its size when swiping and nothing below it moves.
  var ocMe = null;
  function steadyOc() {
    var body = app.querySelector(".oc-card .oc-body");
    if (!body) return;
    var probe = document.createElement("div"), t = today(), html = "";
    probe.style.cssText = "position:absolute;visibility:hidden;left:0;top:0;width:" + body.clientWidth + "px";
    for (var i = -7; i < DATA.weeks * 7 + 7; i++) { var oc = openClose(addDays(t, i)); if (oc) html += "<div>" + ocGrid(oc, ocMe) + "</div>"; }
    probe.innerHTML = html;
    body.parentNode.appendChild(probe);
    var h = 0;
    for (var c = probe.firstChild; c; c = c.nextSibling) h = Math.max(h, c.offsetHeight);

    body.style.minHeight = h + "px";
  }
  function openCloseHtml(me) {

  function ocGrid(oc, me) {

      '<li class="' + (me && !oc.close.apt && oc.close.names.indexOf(me.name) >= 0 ? "mine" : "") + '"><span class="oc-k">Stänger</span><span class="oc-t">' + hhmm(oc.close.min) + '</span><span class="oc-n">' + esc(closeNames(oc.close, me)) + "</span></li></ul>";

  function todayCard(me, compactView) {
    var t = today(), sh = shiftOn(me, t), st = statusFor(me, t), info = sh.closed ? null : dayInfo(t);
    var out = '<div class="eyebrow">Idag · ' + DAYS[dow(t)] + " " + (compactView ? shortDate(t) : t.getDate() + " " + MONTHS_LONG[t.getMonth()]) + (info ? ' · <span class="dayinfo ' + info.type + '">' + esc(info.name) + "</span>" : "") + "</div>";
    if (sh.kind === "work") out += '<div class="big-sub">' + sh.ranges.map(function (r) { return '<div class="big"><span class="t">' + hhmm(r.s) + '</span> <span class="sep">–</span> <span class="t">' + hhmm(r.e) + "</span></div>"; }).join("") + "</div>";
    else if (sh.kind === "note") out += '<div class="big off">' + esc(sh.label) + "</div>";
    else out += '<div class="big off">' + (sh.closed ? esc(sh.closed) : "Ledig") + "</div>";
    var live = st && st.cls === "live", now = nowMinutes();
    if (live) {

    }

    }

  // The "Idag" button keeps its space when hidden, so the arrows never move.

  // "19–25 okt", or "26 okt–1 nov" when the week spans two months.

  // ---------- Favourite colleagues (kept per viewer in this browser) ----------

  // Week table for you and your favourites; follows the week shown above it.

  // Saturday and Sunday are only shown when the uploaded schedule has shifts on them.
  function hasWeekend() {

  }

  // A person's week with arrows to step between weeks. Used on Mitt schema and in a colleague's sheet.
  function weekBlock(p, offset, act, back) {
    var t = today(), mon = addDays(mondayOf(t), offset * 7), total = 0, count = 0, rows = "", weekend = hasWeekend();
    for (var i = 0; i < 7; i++) {
      var d = addDays(mon, i), s = shiftOn(p, d), isT = dayNum(d) === dayNum(t), past = dayNum(d) < dayNum(t), info = dayInfo(d);
      if (i >= 5 && !weekend && s.kind === "off") continue;
      total += workMinutes(s); if (s.kind === "work") count++;
      var tcell;
      if (s.kind === "work") tcell = '<span class="t">' + rangeText(s) + "</span>" + (s.label ? '<span class="lbl">' + esc(s.label) + "</span>" : "");
      else if (s.kind === "note") tcell = '<span class="notetxt">' + esc(s.label) + "</span>";
      else tcell = '<span class="t offtxt">' + (s.closed ? esc(s.closed) : "Ledig") + "</span>" + (s.label ? '<span class="lbl">' + esc(s.label) + "</span>" : "");
      var dx = extraOn(p, d);
      if (dx) tcell += '<span class="lbl extra">' + esc(dx) + "</span>";
      if (s.changed) tcell += '<span class="lbl changed">Ändrat · ordinarie ' + esc(baseText(s.base)) + "</span>";
      var cls = [isT ? "is-today" : past ? "is-past" : "", info ? "has-info " + info.type : ""].join(" ").trim();
      rows += '<li class="' + cls + '"' + (isT ? ' aria-current="date"' : "") + ' data-act="edit" data-name="' + esc(p.name) + '" data-date="' + ymd(d) + '"' + (back ? ' data-back="1"' : "") + ' tabindex="0" role="button" aria-label="' + esc(DAYS[i] + " " + shortDate(d) + ", visa") + '">' +
        '<div><div class="d-name">' + DAYS_SHORT[i] + '</div><div class="d-date">' + (isT ? "Idag" : shortDate(d)) + "</div>" + (s.closed ? "" : dayLabelHtml(d)) + '</div><div class="d-time">' + tcell + '</div><div class="d-hrs">' + (s.kind === "work" ? hours(workMinutes(s)) : "") + "</div></li>";
    }

      '<div class="stepper">' + todayBtn(act + "0", offset !== 0) +
      (act === "week" ? "" : '<button class="icon-btn" data-act="' + act + '" data-d="-1" aria-label="Föregående vecka">' + ICON.left + '</button><button class="icon-btn" data-act="' + act + '" data-d="1" aria-label="Nästa vecka">' + ICON.right + "</button>") + "</div></div>" +
      '<ul class="week" data-slide>' + rows + "</ul>" +
      (act === "week" ? swipeHint(act, DATA.weeks, rotWeek(mon), "vecka") : '<div class="week-sum" data-slide><span>' + count + ' pass</span><span>Totalt <strong>' + hours(total) + "</strong></span></div>") + "</section>";
  }
  // Under a swipeable card: light arrows around one dot per step, the current one filled.
  // Den här veckan has one dot per schemavecka, Avdelningskollegor one per weekday.
  function swipeHint(act, n, cur, unit) {
    var dots = "";

    return '<div class="swipe-hint"><button data-act="' + act + '" data-d="-1" aria-label="Föregående ' + unit + '">' + ICON.left + '</button><span class="dots" aria-hidden="true">' + dots + '</span><button data-act="' + act + '" data-d="1" aria-label="Nästa ' + unit + '">' + ICON.right + "</button></div>";
  }

  function renderHome(me, noCard) {

    out += openCloseHtml(me);

    out += '<div class="home-card">' + weekBlock(me, state.weekOffset, "week", false) + "</div>";

  // ---------- Change editor (bottom sheet) ----------
  function openEditor(name, date, back) {

      '<div class="sheet-head"><div style="min-width:0"><h3 id="sheet-title">' + (isMe ? "Ditt pass" : esc(p.name)) + '</h3><div class="sub">' + DAYS[dow(d)] + " " + shortDate(d) + " · " + esc(baseText(eff)) + "</div>" + dayLabelHtml(d) + "</div>" +
      '<button class="icon-btn" data-act="closeedit" aria-label="Stäng">' + ICON.close + "</button></div>";

    if (eff.kind === "work") out += '<div class="btn-row"><a class="btn" href="' + esc(gcalUrl(d, eff, extraOn(p, d))) + '" target="_blank" rel="noopener">Lägg till i Google Kalender</a></div>';

  // ---------- Compact view for small square screens (Galaxy Z Flip cover screen) ----------
  // The cover screen is small and almost square. MultiStar can give the page a
  // larger viewport than expected, so also accept a near-square window or screen.
  function squareish(w, h) { return w > 0 && h > 0 && w / h > 0.75 && w / h < 1.34; }
  function coverScreen() {
    // The keyboard makes the window shorter while typing; that is not the cover screen.
    var ae = document.activeElement;
    if (typeof wasCover === "boolean" && ((ae && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)) || Date.now() < keyboardUntil)) return wasCover;
    var w = window.innerWidth, h = window.innerHeight, sw = screen.width, sh = screen.height;
    return (w <= 520 && h <= 520) || (w <= 640 && squareish(w, h)) || (sw <= 640 && squareish(sw, sh));
  }
  // The keyboard takes a moment to close after a field is saved or removed; keep the view until it has.
  var keyboardUntil = 0;
  document.addEventListener("focusout", function (e) { if (e.target && /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) keyboardUntil = Date.now() + 1500; }, true);
  var wasCover = coverScreen();
  function glanceActive(me) { return !!(coverScreen() && me && !state.picking); }
  // Week card for the cover screen: this week only, just day and time, large.
  function coverWeek(me) {
    var t = today(), mon = addDays(mondayOf(t), cover.week * 7), weekend = hasWeekend(), rows = "";
    for (var i = 0; i < 7; i++) {
      var d = addDays(mon, i), s = shiftOn(me, d), isT = dayNum(d) === dayNum(t);
      if (i >= 5 && !weekend && s.kind === "off") continue;
      var txt = s.kind === "work" ? rangeText(s) : s.kind === "note" ? esc(s.label) : s.closed ? esc(s.closed) : "Ledig";
      rows += '<li class="' + (isT ? "is-today" : "") + (s.kind === "work" ? "" : " off") + '"><span class="cw-d">' + DAYS_SHORT[i] + '</span><span class="cw-t">' + txt + "</span></li>";
    }
    var label = cover.week === 0 ? "Den här veckan" : cover.week === 1 ? "Nästa vecka" : cover.week === -1 ? "Förra veckan" : "Vecka " + isoWeek(mon);
    return '<div data-cs1><div class="cw-head"><span class="cw-h">' + label + '</span><span class="cw-s">v.\u00a0' + isoWeek(mon) + '</span></div><ul class="cw">' + rows + "</ul></div>";
  }
  // Department card for the cover screen: who works when today.
  function coverTeam(me) {
    var t = addDays(today(), cover.team), fp = favPeople(me);
    var head = '<div class="cw-head"><span class="cw-h">' + coverWhen(cover.team, t) + '</span></div>';
    if (!fp.length) return '<div class="cw-head"><span class="cw-h">Avdelningen idag</span></div><p class="cw-empty">Välj avdelningskollegor under Inställningar.</p>';
    return '<div data-cs2>' + head + '<ul class="cw team">' + [me].concat(fp).map(function (p) {
      var s = shiftOn(p, t), isMe = p.name === me.name;
      var txt = s.kind === "work" ? rangeText(s) : s.kind === "note" ? esc(s.label) : s.closed ? esc(s.closed) : "Ledig";
      return '<li class="' + (isMe ? "me" : "") + (s.kind === "work" ? "" : " off") + '"><span class="cw-n">' + (isMe ? "Du" : esc(p.name)) + '</span><span class="cw-t">' + txt + "</span></li>";
    }).join("") + "</ul></div>";
  }
  // Sideways on the cover screen: the first and last card change day, the middle one week.
  // Days nobody works are skipped. Coming back to the cover screen starts from today again.
  var cover = { day: 0, week: 0, team: 0 };
  function coverWhen(off, d) { return off === 0 ? "Avdelningen idag" : off === 1 ? "Imorgon" : off === -1 ? "Igår" : DAYS[dow(d)] + " " + shortDate(d); }
  function coverDay(me) {
    if (cover.day === 0) return todayCard(me, true);
    var d = addDays(today(), cover.day), sh = shiftOn(me, d), info = dayInfo(d);
    var out = '<div class="eyebrow">' + (cover.day === 1 ? "Imorgon · " : cover.day === -1 ? "Igår · " : "") + DAYS[dow(d)] + " " + shortDate(d) + (info ? " · " + esc(info.name) : "") + "</div>";
    if (sh.kind === "work") out += '<div class="big-sub">' + sh.ranges.map(function (r) { return '<div class="big"><span class="t">' + hhmm(r.s) + '</span> <span class="sep">–</span> <span class="t">' + hhmm(r.e) + "</span></div>"; }).join("") + "</div>";
    else out += '<div class="big off">' + (sh.kind === "note" ? esc(sh.label) : sh.closed ? esc(sh.closed) : "Ledig") + "</div>";
    if (sh.kind === "work") out += '<div class="row"><span class="hint mono">' + hours(workMinutes(sh)) + "</span></div>";
    return out;
  }
  function stepCover(kind, dir) {

      var k = kind === "cday" ? "day" : "team", next = ocDayFrom(cover[k] + dir, dir);

    }
    slideSel = kind === "cday" ? "[data-cs0]" : kind === "cweek" ? "[data-cs1]" : "[data-cs2]"; slideDir = dir; render(); buzz();
  }

  // The cover screen: three cards to scroll between, no tabs.
  var deckPage = 0;
  function renderGlance(me) {
    var dots = [0, 1, 2].map(function (i) { return '<span class="' + (i === deckPage ? "on" : "") + '"></span>'; }).join("");
    return '<div class="deck" id="deck">' +
      '<section class="page glance" aria-label="Idag"><div class="today" data-cs0>' + coverDay(me) + "</div></section>" +

      '<section class="page" aria-label="Avdelningen idag"><div class="pcard cover-card">' + coverTeam(me) + "</div></section>" +
      '</div><div class="deck-dots" aria-hidden="true">' + dots + "</div>";
  }

  // "Visa alla" or "Avdelningsvis": the chosen one is written out, the other is an icon.
  function modeSwitch(act, byDept) {
    return '<button class="mode-switch" role="switch" aria-checked="' + !!byDept + '" aria-label="Avdelningsvis" data-act="' + act + '" data-m="' + (byDept ? "all" : "dept") + '">' +

  }
  // Departments in display order, your own first.
  function deptOrder(me, depts) {
    var order = depts.map(function (d, i) { return i; }), mine = me ? deptOf(me) : null;
    return mine != null ? [mine].concat(order.filter(function (i) { return i !== mine; })) : order;
  }
  function deptHead(name, sub) {
    return '<div class="sec-head"><div><h2>' + esc(name) + "</h2>" + (sub ? '<div class="sub">' + sub + "</div>" : "") + "</div></div>";
  }

  // Kollegor: everyone today. Grouped by where they are in the day (working now, not started,
  // finished, off) and sorted by start or end time, or simply by name. Can be shown per department;
  // a search shows the matches in one list.
  function stepPeople(n) {
    var next = ocDayFrom(state.peopleOff + n, n);
    if (next == null) return;
    state.peopleOff = next; slideSel = "[data-pslide]"; slideDir = n; render(); buzz();
  }
  // The time slider: the day's working hours, whole half hours at the ends.
  function dayHours(t) {
    var lo = 24 * 60, hi = 0;
    DATA.people.forEach(function (p) { var s = shiftOn(p, t); if (s.kind === "work") { lo = Math.min(lo, s.ranges[0].s); hi = Math.max(hi, s.ranges[s.ranges.length - 1].e); } });
    return hi > lo ? { lo: Math.floor(lo / 30) * 30, hi: Math.ceil(hi / 30) * 30 } : { lo: 6 * 60, hi: 18 * 60 };
  }
  function renderPeople(me, listOnly) {
    // Who works at a moment: now today, or the time chosen with the slider. Another day without
    // a chosen time has no moment, so everyone working is one group.
    var off = state.peopleOff, isToday = off === 0, t = addDays(today(), off), depts = deptList(), byDept = depts && state.peopleMode === "dept";
    var at = state.peopleAt != null ? state.peopleAt : isToday ? nowMinutes() : null, chosen = state.peopleAt != null, now = at;
    var sort = state.daySort === "end" ? "end" : "start", q = norm(state.peopleQ || "").trim(), closed = closedDay(t);
    var absent = dayEdit(t).absent;
    var all = DATA.people.map(function (p) {
      var s = shiftOn(p, t), st = 3, txt, away = absent[keyOf(p)];
      if (away) return { p: p, s: { kind: "note", label: absenceName(away), ranges: [] }, st: 3, txt: esc(absenceName(away)) };
      if (s.kind === "work" && at == null) { st = 0; txt = rangeText(s); }
      else if (s.kind === "work") {
        var cur = s.ranges.some(function (r) { return now >= r.s && now < r.e; }), next = s.ranges.some(function (r) { return now < r.s; });
        st = cur ? 0 : next ? 1 : 2; txt = rangeText(s);
      } else txt = s.kind === "note" ? esc(s.label) : s.closed ? esc(s.closed) : "Ledig";
      return { p: p, s: s, st: st, txt: txt };
    });
    function byName(a, b) { return a.p.name.localeCompare(b.p.name, "sv"); }
    // Those who have gone home: whoever left last comes first, whichever sort is chosen.
    function timeKey(x) { return x.st === 3 ? 0 : x.st === 2 ? -x.s.ranges[x.s.ranges.length - 1].e : sort === "end" ? x.s.ranges[x.s.ranges.length - 1].e : x.s.ranges[0].s; }
    function cmp(a, b) { return a.st - b.st || timeKey(a) - timeKey(b) || byName(a, b); }
    function row(x) {
      var isMe = me && me.name === x.p.name, cls = x.st === 0 ? (at != null ? "now" : "work") : x.st === 3 ? (x.s.kind === "note" ? "note" : "past") : x.st === 2 ? "past" : "work";
      return '<li data-q="' + esc(norm(x.p.name)) + '"' + (isMe ? ' class="me"' : "") + '><button class="prow slim" data-act="person" data-name="' + esc(x.p.name) + '"><span class="pn">' + esc(x.p.name) + (isMe ? "<small>du</small>" : isExtra(x.p) ? "<small>förstärkning</small>" : "") + '</span><span class="pt ' + cls + '">' + x.txt + "</span></button></li>";
    }
    function ul(list) { return '<ul class="plist">' + list.slice().sort(cmp).map(row).join("") + "</ul>"; }
    var atText = chosen ? " kl. " + hhmm(at) : isToday ? " nu" : "";
    var STATES = ["Jobbar" + atText, chosen ? "Börjar senare" : "Har inte börjat", chosen ? "Har redan gått" : "Har slutat", "Lediga och frånvarande"], list;
    if (q) list = '<ul class="plist">' + all.slice().sort(byName).map(row).join("") + "</ul>";
    else if (byDept) {
      var groups = deptOrder(me, depts).map(function (i) { return { name: depts[i].name, idx: i, xs: all.filter(function (x) { return deptOf(x.p) === i; }) }; });
      groups.push({ name: "Utan avdelning", xs: all.filter(function (x) { return deptOf(x.p) == null; }) });
      list = groups.filter(function (g) { return g.xs.length; }).map(function (g) {
        var n = g.xs.filter(function (x) { return x.st === 0; }).length;
        return '<section class="pgroup">' + deptHead(g.name, closed ? g.xs.length + " personer" : n + " av " + g.xs.length + " jobbar" + atText) + ul(g.xs) + "</section>";
      }).join("");
    } else if (closed) list = '<ul class="plist">' + all.slice().sort(byName).map(row).join("") + "</ul>";
    else list = STATES.map(function (title, st) {
      var xs = all.filter(function (x) { return x.st === st; });
      return xs.length ? '<section class="pgroup"><div class="sec-head"><h2>' + title + ' <span class="cnt">' + xs.length + "</span></h2></div>" + ul(xs) + "</section>" : "";
    }).join("");

    if (listOnly) return list;
    var slider = closed ? "" : '<div class="time-pick"><button class="time-btn" data-act="timeopen" aria-haspopup="dialog"><span class="tp-t">Tid</span><span class="tp-v">' +
      (chosen ? "Kl. " + hhmm(at) : isToday ? "Nu, " + hhmm(at) : "Hela dagen") + "</span>" + ICON.down + "</button>" +
      (chosen ? '<button class="text-btn" data-act="peopleat0">' + (isToday ? "Nu" : "Hela dagen") + "</button>" : "") + "</div>";
    return '<div class="view">' + exampleNote() +
      '<div class="sec-head kol-head"><h2>Kollegor</h2><div class="head-tools">' + '<button class="icon-btn report-btn" data-act="reportopen" aria-label="Dagsrapport" title="Dagsrapport">' + ICON.report + "</button>" + (isToday ? "" : todayBtn("people0", true)) + (depts ? modeSwitch("peoplemode", byDept) : "") + "</div></div>" +
      '<div class="day-nav"><button class="dn-arrow" data-act="peopleday" data-d="-1" aria-label="Föregående dag">' + ICON.left + "</button>" +
      '<span class="dn-mid"><span class="dn-label" data-pslide>' + (off === 0 ? "Idag · " : off === 1 ? "Imorgon · " : off === -1 ? "Igår · " : "") + (off >= -1 && off <= 1 ? DAYS[dow(t)].toLowerCase() : DAYS[dow(t)]) + " " + shortDate(t) + "</span></span>" +
      '<button class="dn-arrow" data-act="peopleday" data-d="1" aria-label="Nästa dag">' + ICON.right + "</button></div>" +
      '<section class="people-sec"><div class="tools"><input id="people-q" class="search" type="search" placeholder="Sök namn" value="' + esc(state.peopleQ) + '" autocomplete="off" aria-label="Sök namn">' +
      '<div class="mini-seg" role="group" aria-label="Sortera på"><button data-act="daysort" data-s="start" aria-pressed="' + (sort === "start") + '" aria-label="Sortera på starttid">Start</button><button data-act="daysort" data-s="end" aria-pressed="' + (sort === "end") + '" aria-label="Sortera på sluttid">Slut</button></div></div>' +
      (closed && !q ? '<p class="hint">' + esc(closed) + ", förskolan är stängd.</p>" : "") + (q ? "" : slider) +
      '<div id="people-list" data-pslide>' + list + '</div><p class="hint" id="people-none" hidden>Inget namn matchar.</p></section></div>';
  }

  function empText(p) {

  // One colleague: today's shift and their week, with arrows to change week.
  function renderPersonSheet(me) {

    var anim = ps.fresh ? " in" : "", away = dayEdit(t).absent[keyOf(p)], awayName = away ? absenceName(away) : "";
    var big = away ? esc(awayName) : sh.kind === "work" ? rangeText(sh) : sh.kind === "note" ? esc(sh.label) : sh.closed ? esc(sh.closed) : "Ledig";

      '<section class="p-today" aria-label="' + (off === 0 ? "Idag" : DAYS[dow(t)]) + '"><div class="group-label">' + (off === 0 ? "Idag, " + DAYS[dow(t)].toLowerCase() : off === 1 ? "Imorgon, " + DAYS[dow(t)].toLowerCase() : DAYS[dow(t)]) + " " + shortDate(t) + '</div><div class="p-big' + (away ? " away" : "") + '">' + big + "</div>" +
      // The buttons sit right under the one-line status, so they stay put when the lines below change.

  // Settings: everyday choices on the first page, schedule and rules as rows that open their own page.
  var SUBS = [["file", "Schemafil"], ["plan", "Planeringstid"], ["depts", "Avdelningar"], ["help", "Vilka Excel-filer fungerar?"], ["favs", "Avdelningskollegor"], ["dept", "Avdelning"], ["extras", "Förstärkning"]];
  // Names sorted as people read them: "(Paula)" among the P's.
  function byPersonName(a, b) { var k = function (n) { return n.replace(/^[^0-9A-Za-zÅÄÖåäöÉé]+/, ""); }; return k(a.name).localeCompare(k(b.name), "sv"); }
  function setRow(act, key, title, value) {
    return '<li><button class="set-row" data-act="' + act + '"' + (key ? ' data-s="' + key + '"' : "") + '><span class="sr-t">' + title + '</span><span class="sr-v">' + esc(value || "") + "</span>" + ICON.right + "</button></li>";
  }
  function settingsMsg() { return state.msg ? '<div class="msg ' + (state.msg.ok ? "ok" : "err") + '" role="status">' + esc(state.msg.text) + "</div>" : ""; }
  function renderSettings(me) {

      setRow("sub", "favs", "Avdelningskollegor", autoF ? "Din avdelning" : fn.length ? fn.length + " valda" : "Inga valda") + "</ul>" +
      '<div class="set-item"><span class="si-t">Utseende</span><div class="seg-ctl" role="group" aria-label="Utseende">';
    [["auto", "Automatiskt", ICON.auto], ["light", "Ljust", ICON.sun], ["dark", "Mörkt", ICON.moon]].forEach(function (o) { out += '<button class="theme-btn" data-act="settheme" data-t="' + o[0] + '" aria-pressed="' + (themePref() === o[0]) + '">' + o[2] + "<span>" + o[1] + "</span></button>"; });
    out += "</div></div>";
    if (me) {

    else if (act === "peopleat0") { state.peopleAt = null; render(); }
    else if (act === "timeopen") { state.timePop = true; render(); var wf = document.getElementById("wh-h"); if (wf) wf.focus({ preventScroll: true }); }
    else if (act === "wheelpick") {

      wl.scrollTo({ top: wi * WHEEL_ROW, behavior: reduceMotion ? "auto" : "smooth" });
    }
    else if (act === "reportgo") { state.view = "grid"; lsSet("skift.view", "grid"); state.peopleOff = 0; state.reportNote = null; state.reportTitle = null; state.report = true; state.reportFresh = true; state.reportErr = null; state.reportCopied = false; render(); window.scrollTo(0, 0); }
    else if (act === "reportopen") { state.reportNote = null; state.reportTitle = null; state.report = true; state.reportFresh = true; state.reportErr = null; state.reportCopied = false; render(); }
    else if (act === "reportclose") { state.report = false; state.absPop = false; render(); }
    else if (act === "abspick") {
      var ak = b.getAttribute("data-k"), ai = state.absSel.indexOf(ak);
      if (ai >= 0) state.absSel.splice(ai, 1); else state.absSel.push(ak);
      render();
    }
    else if (act === "absadd") { state.absPop = true; state.absQ = ""; state.absSel = []; render(); }
    else if (act === "absclose") { state.absPop = false; render(); }
    else if (act === "abswhy") { state.absWhy = b.getAttribute("data-w"); render(); }
    else if (act === "potherpop" && state.person) { state.otherPop = state.person.name; render(); var oi = document.getElementById("other-text"); if (oi) oi.focus(); }
    else if (act === "otherclose") { state.otherPop = null; render(); }
    else if (act === "otherhint") {
      var oin = document.getElementById(b.getAttribute("data-for"));
      if (oin) { oin.value = b.getAttribute("data-v"); if (oin.id === "abs-other") state.absOther = oin.value; oin.focus(); }
    }
    else if (act === "pabsent" && state.person) {
      var pp = personByName(state.person.name), pd = addDays(today(), state.view === "grid" ? state.peopleOff : 0), pr = dayEdit(pd), pn = { absent: Object.assign({}, pr.absent), subs: pr.subs.slice(), note: pr.note, title: pr.title }, pw = b.getAttribute("data-w");
      if (!pp) return;
      if (pw) pn.absent[keyOf(pp)] = pw; else delete pn.absent[keyOf(pp)];
      writeDay(pd, pn);
    }
    else if (act === "absset" || act === "absdel" || act === "subadd" || act === "subdel") {
      var rd = addDays(today(), state.peopleOff), rr = dayEdit(rd), nr = { absent: Object.assign({}, rr.absent), subs: rr.subs.slice(), note: rr.note, title: rr.title };
      if (act === "absset") {
        var aw = state.absWhy || "sjuk";
        if (aw === "annat") { aw = (state.absOther || "").trim().slice(0, 40); if (!aw) { var ao = document.getElementById("abs-other"); if (ao) ao.focus(); return; } }
        state.absSel.forEach(function (k) { nr.absent[k] = aw; });
        state.absSel = []; state.absPop = false;
      }
      else if (act === "absdel") delete nr.absent[b.getAttribute("data-k")];
      else if (act === "subdel") nr.subs.splice(+b.getAttribute("data-i"), 1);
      else {
        var sf = state.reportForm, sn = (sf.name || "").trim();
        if (!sn) { var ni = document.getElementById("sub-name"); if (ni) ni.focus(); return; }
        var sme = personByName(state.profile), sdep = sf.dept != null ? sf.dept : sme ? deptOf(sme) : null;
        var nsub = { name: sn.slice(0, 40), time: sf.s != null ? hhmm(sf.s) + "–" + hhmm(sf.e) : "", dept: sdep == null ? null : sdep };
        nr.subs.push(nsub); rememberSub(nsub);
        state.reportForm = {};
      }
      state.reportErr = null; state.reportCopied = false; writeDay(rd, nr);
    }
    else if (act === "subpast") {
      // A substitute from before: name, hours and department as last time, ready to add or change.
      var pt = parseShift(b.getAttribute("data-t") || ""), pdv = b.getAttribute("data-d");
      state.reportForm = { name: b.getAttribute("data-n"), dept: pdv === "" ? null : +pdv };
      if (pt.kind === "work" && pt.ranges.length) { state.reportForm.s = pt.ranges[0].s; state.reportForm.e = pt.ranges[pt.ranges.length - 1].e; }
      render();
    }
    else if (act === "subtimeopen") { state.subTimePop = true; render(); }
    else if (act === "subtimeclose") { state.subTimePop = false; render(); }
    else if (act === "subtimeclear") { state.reportForm.s = state.reportForm.e = null; state.subTimePop = false; render(); }
    else if (act === "subtimeset") {
      var ts = wheelValue("wh-sh") * 60 + wheelValue("wh-sm"), te = wheelValue("wh-eh") * 60 + wheelValue("wh-em");
      if (te <= ts) { var t2 = ts; ts = te; te = t2; }
      state.reportForm.s = ts; state.reportForm.e = te; state.subTimePop = false; buzz(); render();
    }
    else if (act === "subdept") { state.reportForm.dept = +b.getAttribute("data-i"); render(); }
    else if (act === "rcustom") { state.reportCustom = !state.reportCustom; render(); }
    else if (act === "rfull") { state.reportFull = !state.reportFull; render(); }
    else if (act === "titlesave" || act === "titlereset") {
      var td = addDays(today(), state.peopleOff), hv = document.getElementById("report-head"), base = "";
      if (act === "titlesave" && hv) {
        // The date at the end is added each day, so it is not part of what is saved.
        base = hv.value.trim();
        var suf = reportDate(td);
        if (base.toLowerCase().slice(-suf.length) === suf) base = base.slice(0, -suf.length).trim();
      }
      var to = reportOpts(); to.titleBase = base.slice(0, 60); lsSet("skift.report", JSON.stringify(to));
      var tr = dayEdit(td); state.reportTitle = null; state.reportCopied = false;
      writeDay(td, { absent: tr.absent, subs: tr.subs, note: tr.note, title: "" });
    }
    else if (act === "sameprev") {
      var sd = addDays(today(), state.peopleOff), sc = dayEdit(sd), sp = dayEdit(addDays(today(), +b.getAttribute("data-o")));
      var sn = { absent: Object.assign({}, sp.absent, sc.absent), subs: sc.subs.slice(), note: sc.note, title: sc.title }, sh = sc.subs.map(function (x) { return norm(x.name); });
      sp.subs.forEach(function (x) { if (sh.indexOf(norm(x.name)) < 0) sn.subs.push(x); });
      state.reportCopied = false; writeDay(sd, sn);
    }
    else if (act === "ropt" || act === "rscope") {
      var ro = reportOpts();
      if (act === "ropt") ro[b.getAttribute("data-k")] = !ro[b.getAttribute("data-k")]; else ro.scope = b.getAttribute("data-s");
      lsSet("skift.report", JSON.stringify(ro)); state.reportCopied = false; render();
    }
    else if (act === "rcopy") {
      var ta = document.getElementById("report-text"), txt = ta ? ta.value : "";
      var done = function () { state.reportCopied = true; buzz(); render(); };
      var pv = document.getElementById("report-preview");
      // With formatting where the phone allows it, so the department names stay bold in Teams.
      if (navigator.clipboard && navigator.clipboard.write && window.ClipboardItem && pv) {
        var item = new ClipboardItem({ "text/html": new Blob([pv.innerHTML], { type: "text/html" }), "text/plain": new Blob([txt], { type: "text/plain" }) });
        navigator.clipboard.write([item]).then(done, function () { navigator.clipboard.writeText(txt).then(done, function () {}); });
      }
      else if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, function () { ta.removeAttribute("readonly"); ta.select(); try { document.execCommand("copy"); done(); } catch (x) {} ta.setAttribute("readonly", ""); });
      else if (ta) { ta.select(); try { document.execCommand("copy"); done(); } catch (x) {} }
    }
    else if (act === "rshare") { var tx = document.getElementById("report-text"); if (navigator.share && tx) navigator.share({ text: tx.value }).then(null, function () {}); }
    else if (act === "timeclose") { state.timePop = false; render(); }
    else if (act === "timeclear") { state.timePop = false; state.peopleAt = null; render(); }
    else if (act === "timeset") {
      var wh = app.querySelector("#wh-h"), wm = app.querySelector("#wh-m");
      state.peopleAt = +wh.children[+wh.getAttribute("data-cur")].getAttribute("data-v") * 60 + +wm.children[+wm.getAttribute("data-cur")].getAttribute("data-v");
      state.timePop = false; buzz(); render();
    }
    else if (act === "peopleday") { slideWeek(+b.getAttribute("data-d"), "people"); }
    else if (act === "people0") { if (state.peopleOff) { slideSel = "[data-pslide]"; slideDir = state.peopleOff > 0 ? -1 : 1; state.peopleOff = 0; render(); buzz(); } }
    else if (act === "oc0") { var o0 = ocDayFrom(0, 1); if (o0 != null && state.ocOffset !== o0) { slideSel = "[data-ocslide]"; slideDir = o0 < state.ocOffset ? -1 : 1; state.ocOffset = o0; render(); buzz(); } }
    else if (act === "ocday") { slideWeek(+b.getAttribute("data-d"), "oc"); }
    else if (act === "week0") { var w0 = state.weekOffset; if (w0) stepWeek(-w0); }
    else if (act === "cancel") { state.pending = null; state.msg = null; render(); }
    else if (act === "save" && state.pending && !state.saving) { save(state.pending, "Schemat är sparat och visas nu för alla som öppnar appen."); }
    else if (act === "pendweek" && state.pending) { state.pending.anchor = ymd(addDays(mondayOf(today()), -(+b.getAttribute("data-w")) * 7)); render(); }
    else if (act === "setweek" && !state.saving) {
      var w = +b.getAttribute("data-w");

      nd.anchor = ymd(addDays(mondayOf(today()), -w * 7));

    }
    else if (act === "planopen") { state.planOpen = b.getAttribute("data-name"); render(); var pf = app.querySelector(".plan-pop [aria-pressed=true]"); if (pf) pf.focus(); }
    else if (act === "planclose") { state.planOpen = null; render(); }
    else if (act === "deptrename") { state.deptPop = { kind: "rename", i: +b.getAttribute("data-i") }; render(); var di = document.getElementById("dept-name"); if (di) { di.focus(); di.select(); } }
    else if (act === "deptmove") { state.deptPop = { kind: "move", name: b.getAttribute("data-name") }; render(); }
    else if (act === "deptset") { var mv = keyOfName(state.deptPop.name); state.deptPop = null; state.deptErr = null; writeDept("move", mv, +b.getAttribute("data-i")); }
    else if (act === "pname" && state.person) { state.deptPop = { kind: "pname", name: state.person.name }; render(); var pi = document.getElementById("dept-name"); if (pi) { pi.focus(); pi.select(); } }
    else if (act === "deptclose") { state.deptPop = null; render(); }
    else if (act === "setplan") { var ph = b.getAttribute("data-h"); state.planOpen = null; writePlan(b.getAttribute("data-name"), ph === "" ? null : +ph); }
    else if (act === "setbreak" && !state.saving) {
      var bm = +b.getAttribute("data-m");
      if (bm === breakMin()) return;
      var nb = JSON.parse(JSON.stringify(DATA));

      nb.updated = new Date().toISOString();
      save(nb, bm ? "Rasten är nu " + bm + " minuter." : "Ingen rast dras av längre.");
    }
    else if (act === "edit") { openEditor(b.getAttribute("data-name"), b.getAttribute("data-date"), b.getAttribute("data-back") === "1"); }
    else if (act === "person") { state.person = { name: b.getAttribute("data-name"), week: 0, fresh: true }; render(); }
    else if (act === "closesheet") { closeSheet(); }
    else if (act === "pweek") { slideWeek(+b.getAttribute("data-d")); }
    else if (act === "pweek0") { if (state.person && state.person.week) stepPersonWeek(-state.person.week); }
    else if (act === "closeedit") { closeSheet(); }
    else if (act === "exportcal") { var mp = state.profile && personByName(state.profile); if (mp) exportCalendar(mp); }
    else if (act === "settheme") { lsSet("skift.theme", b.getAttribute("data-t") === "auto" ? null : b.getAttribute("data-t")); applyTheme(); render(); }
    else if (act === "droplocal") { lsSet("skift.local", null); LOCAL = null; DATA = EMBEDDED; usingLocal = false; shiftCache = {}; state.msg = null; render(); }
  });
  app.addEventListener("input", function (e) {
    if (e.target.id === "pick-q") { state.pickQ = e.target.value; filterPicker(state.pickQ); return; }
    if (e.target.id === "report-note" || e.target.id === "report-head") {
      if (e.target.id === "report-note") state.reportNote = e.target.value; else state.reportTitle = e.target.value;
      state.reportCopied = false;

      var rtx = reportText(personByName(state.profile), addDays(today(), state.peopleOff), state.reportNote), rpv = document.getElementById("report-preview");

    if (e.target.id === "fav-q") { state.favQ = e.target.value; filterList(state.favQ, "#fav-list", "fav-none"); return; }
    if (e.target.id === "plan-q") { state.planQ = e.target.value; filterList(state.planQ, "#plan-list", "plan-none"); return; }

  });
  app.addEventListener("keydown", function (e) {
    if ((e.key === "ArrowUp" || e.key === "ArrowDown") && e.target.classList && e.target.classList.contains("wheel")) { e.preventDefault(); e.target.scrollTop += (e.key === "ArrowDown" ? 1 : -1) * WHEEL_ROW; return; }

    if (e.key === "Escape" && state.otherPop) { state.otherPop = null; render(); return; }
    if (e.key === "Escape" && state.absPop) { state.absPop = false; render(); return; }
    if (e.key === "Escape" && state.report) { state.report = false; render(); return; }
    if (e.key === "Escape" && (state.planOpen || state.deptPop || state.timePop)) { state.planOpen = null; state.deptPop = null; state.timePop = false; render(); return; }
    if (e.key === "Escape" && (state.edit || state.person)) { closeSheet(); return; }

      var vis = Array.prototype.filter.call(app.querySelectorAll(".plist li"), function (li) { return !li.hidden; });
      if (vis.length === 1) vis[0].querySelector("button").click();
      return;
    }
    if ((e.key === "Enter" || e.key === " ") && e.target.getAttribute && e.target.getAttribute("role") === "button" && e.target.hasAttribute("data-act")) { e.preventDefault(); e.target.click(); }
  });
  app.addEventListener("change", function (e) {

  });
  app.addEventListener("dragover", function (e) { var d = e.target.closest && e.target.closest("#drop"); if (d) { e.preventDefault(); d.classList.add("over"); } });

    var d = e.target.closest && e.target.closest("#drop"); if (!d) return;

  document.addEventListener("visibilitychange", function () { if (!document.hidden && state.view !== "settings" && !state.edit) render(); });
  // Re-check on resize (folding/unfolding); return to the card each time the cover screen comes back.
  var resizeT;
  window.addEventListener("resize", function () {

    }, 150);
  });

  initDb();
  render();
})();
