<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#331b3f">
</head>
<body>
<title>Schemapp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style id="app-style">
/* Layout: one narrow column (max 34rem), plum header band, bottom tab bar; works down to the ~300px cover screen of a flip phone */
/* Palette: plum #331B3F (ink, header, actions), sage #ACC7B4 (highlights), ochre #E3A33B (accent: now, today, live) */
:root {
  --bg: #eef3ef;
  --surface: #ffffff;
  --ink: #331b3f;
  --muted: #6c5d73;
  --line: #d5e2d8;
  --accent: #331b3f;
  --accent-ink: #ffffff;
  --accent-soft: #dde9e0;
  --sage: #acc7b4;
  --sage-ink: #331b3f;
  --hl: #e3a33b;
  --hl-ink: #8a5a0e;
  --head-bg: #331b3f;
  --head-ink: #f4eef6;
  --head-line: rgba(255, 255, 255, 0.18);
  --live: #2d6e4a;
  --live-soft: #d9ebdf;
  --warn: #8f4f12;
  --warn-soft: #f8e8cf;
  --bar-off: #e6ece7;
  --red: #b02a42;
  --red-soft: #f8e1e5;
  --font-display: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: var(--font-body);
  --radius: 14px;
  /* Type scale: five sizes only. */
  --fs-xs: 0.75rem;
  --fs-sm: 0.8125rem;
  --fs-md: 0.9375rem;
  --fs-lg: 1.125rem;
  --fs-xl: 1.375rem;
  /* Spacing: between sections, and inside a section. */
  --space-section: 24px;
  --space-inner: 10px;
  --nav-h: 60px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #170d1c; --surface: #23152b; --ink: #efe9f1; --muted: #b4a7ba; --line: #3a2a44;
    --accent: #acc7b4; --accent-ink: #331b3f; --accent-soft: #2c3a31; --sage: #acc7b4; --sage-ink: #331b3f;
    --hl: #e8b04d; --hl-ink: #f0c26a; --head-bg: #331b3f; --head-ink: #f4eef6; --head-line: rgba(255, 255, 255, 0.16);
    --live: #9fd3ae; --live-soft: #22382a; --warn: #f0b259; --warn-soft: #3a2a12; --bar-off: #33243c; --red: #ff8b9c; --red-soft: #3d1b26; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #170d1c; --surface: #23152b; --ink: #efe9f1; --muted: #b4a7ba; --line: #3a2a44;
  --accent: #acc7b4; --accent-ink: #331b3f; --accent-soft: #2c3a31; --sage: #acc7b4; --sage-ink: #331b3f;
  --hl: #e8b04d; --hl-ink: #f0c26a; --head-bg: #331b3f; --head-ink: #f4eef6; --head-line: rgba(255, 255, 255, 0.16);
  --live: #9fd3ae; --live-soft: #22382a; --warn: #f0b259; --warn-soft: #3a2a12; --bar-off: #33243c; --red: #ff8b9c; --red-soft: #3d1b26; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; }
.wrap {
  max-width: 34rem; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.mono { font-variant-numeric: tabular-nums; }

main { padding-top: calc(env(safe-area-inset-top, 0px) + 20px); padding-bottom: calc(var(--nav-h) + 24px); overflow-x: clip; }
main .wrap { display: flex; flex-direction: column; gap: var(--space-section); padding-block: 4px 8px; }
.view, .slide-body { display: flex; flex-direction: column; gap: var(--space-section); }
.week-sec { display: flex; flex-direction: column; gap: var(--space-inner); }

.example-note {
  background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-size: var(--fs-sm); line-height: 1.4;
}
.example-note button { background: none; border: 0; padding: 0; text-decoration: underline; color: inherit; font-weight: 600; cursor: pointer; }

/* Today card */
.today { background: linear-gradient(135deg, #a7c4af 0%, #b8ccbf 50%, #c8d3ce 100%); color: var(--sage-ink); border-radius: var(--radius); padding: 20px 18px 18px; display: flex; flex-direction: column; gap: 8px; }
/* Today's shift: same sage as today's row in the week, plum text in both themes. */
.today .eyebrow, .today .hint, .today .next, .today .next strong, .today .extra-line, .today .dayinfo, .today .big .sep,
.today .pill, .today .pill.live, .today .pill.soon, .today .pill.done, .today .pill.changed { color: var(--sage-ink); }
.today .eyebrow { font-size: var(--fs-sm); }
.today .big { font-size: clamp(2.2rem, 11.5vw, 3.4rem); white-space: nowrap; letter-spacing: -0.03em; }
.today .big.off { white-space: normal; }
.today .big-sub .big { display: flex; flex-direction: column; font-size: clamp(3rem, 19vw, 4.75rem); line-height: 0.95; letter-spacing: -0.04em; }
.today .big-sub .big .sep { display: none; }
.today .big-sub:has(.big + .big) .big { flex-direction: row; gap: 0.25em; font-size: clamp(2rem, 10vw, 3rem); }
.today .big-sub:has(.big + .big) .big .sep { display: inline; }
.today .pill { font-size: var(--fs-md); font-weight: 700; }
.today .hint { opacity: 0.85; }
.today .next { border-top-color: rgba(51, 27, 63, 0.22); }
.eyebrow { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.big { font-weight: 700; font-size: clamp(1.8rem, 9.5vw, 2.7rem); letter-spacing: -0.025em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.big.off { letter-spacing: -0.015em; }
.big .sep { color: var(--muted); font-weight: 500; }
.big-sub { display: flex; flex-direction: column; gap: 2px; }
.today .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 4px; }
.today .meta { font-size: var(--fs-sm); color: var(--sage-ink); opacity: 0.75; font-variant-numeric: tabular-nums; }
.pill { font-size: var(--fs-md); font-weight: 600; }
.pill.live { color: var(--live); }
.pill.soon { color: var(--ink); }
.pill.done { color: var(--muted); font-weight: 500; }
.pill.note { color: var(--warn); }
.hint { color: var(--muted); font-size: var(--fs-sm); }
.next { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 10px; font-size: var(--fs-sm); color: var(--muted); }
.next strong { color: var(--ink); font-weight: 600; }

/* Section heads */
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sec-head h2 { font-weight: 700; font-size: var(--fs-lg); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.sec-head .sub { color: var(--muted); font-size: var(--fs-sm); }
.stepper { display: flex; gap: 6px; flex: none; }
.icon-btn { width: 36px; height: 36px; border-radius: 10px; border: 0; background: var(--accent-soft); display: grid; place-items: center; cursor: pointer; }
.icon-btn svg { width: 16px; height: 16px; stroke: var(--ink); }
.text-btn.keep-space { visibility: hidden; }
.text-btn { height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 0 12px; font-size: var(--fs-sm); font-weight: 600; cursor: pointer; }

/* Week list */
.week { list-style: none; margin: 0; padding: 0; border-bottom: 1px solid var(--line); }
.week li { display: grid; grid-template-columns: 3.6rem 1fr auto; align-items: center; gap: 10px; padding: 11px 8px; border-top: 1px solid var(--line); min-height: 52px; }
.week li.is-today, .week li.is-today:hover { background: var(--sage); color: var(--sage-ink); border-radius: 10px; border-top-color: transparent; }
.week li.is-today + li { border-top-color: transparent; }
.is-today .d-date { color: var(--sage-ink); font-weight: 700; }
.is-today .d-hrs, .is-today .d-time .lbl, .is-today .d-time .lbl.extra, .is-today .d-time .lbl.changed, .is-today .d-time .t.offtxt, .is-today .d-time .notetxt, .is-today .dayinfo { color: var(--sage-ink); }
.is-today .d-time .t { font-weight: 700; }
.week li.is-past { color: var(--muted); }
.d-name { font-weight: 600; font-size: var(--fs-md); line-height: 1.2; }
.d-date { color: var(--muted); font-size: var(--fs-xs); }
.is-today .d-name { color: var(--sage-ink); font-weight: 700; }
.d-time { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.d-time .t { font-weight: 500; font-variant-numeric: tabular-nums; font-size: var(--fs-md); }
.d-time .t.offtxt { font-family: var(--font-body); color: var(--muted); font-weight: 400; }
.d-time .lbl { font-size: var(--fs-xs); color: var(--muted); }
.d-time .notetxt { font-family: var(--font-body); color: var(--warn); font-weight: 600; font-size: var(--fs-md); }
.d-time .lbl.extra, .tt.extra { color: var(--accent); font-family: var(--font-body); font-weight: 500; }
.extra-line { font-size: var(--fs-sm); color: var(--accent); font-weight: 500; }
.d-hrs { font-size: var(--fs-sm); color: var(--muted); font-variant-numeric: tabular-nums; }
.week-sum { display: flex; justify-content: space-between; gap: 12px; padding: 0 4px; color: var(--muted); font-size: var(--fs-sm); }
.week-sum strong { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip[aria-pressed] { min-height: 36px; padding: 6px 12px; font-size: var(--fs-sm); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.fav-scroll { overflow-x: auto; }
.favs { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: var(--fs-sm); }
.favs th, .favs td { padding: 7px 2px; text-align: center; border-top: 1px solid var(--line); }
.favs thead th { border-top: 0; font-weight: 600; color: var(--muted); line-height: 1.2; }
.favs thead th b { display: block; color: var(--ink); }
.favs tbody th { text-align: left; font-weight: 600; max-width: 5.5rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-left: 0; padding-right: 6px; }
.favs td[data-act] { cursor: pointer; }
.favs td span { display: block; line-height: 1.25; }
.favs td.off { color: var(--muted); }
.favs td.note { color: var(--warn); font-size: var(--fs-xs); }
.fav-sec { display: flex; flex-direction: column; gap: var(--space-inner); }
.favs tr.me th { color: var(--muted); }
.favs .cur { background: var(--accent-soft); }
.favs thead th.cur { color: var(--ink); }
.favs thead th.cur { border-radius: 8px 8px 0 0; }
.favs thead th.cur b { color: inherit; }
.favs tbody tr:last-child .cur { border-radius: 0 0 8px 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 10px; font-size: var(--fs-sm); }
.chip.me { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.chip em { font-style: normal; color: var(--warn); margin-left: 4px; }
.group-label { font-size: var(--fs-md); color: var(--ink); font-weight: 600; margin-bottom: 6px; }

/* Full rotation grid */

/* Settings */
.panel { border-top: 1px solid var(--line); padding: 16px 0 4px; display: flex; flex-direction: column; gap: 10px; }
.panel h3 { margin: 0; font-size: var(--fs-md); font-weight: 600; }
.panel p { margin: 0; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: var(--fs-sm); }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; cursor: pointer; font-size: var(--fs-md); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.seg-ctl { display: flex; gap: 6px; flex-wrap: wrap; }
.seg-ctl button { min-width: 44px; padding: 0 12px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-family: var(--font-mono); font-weight: 600; cursor: pointer; }
.seg-ctl .theme-btn { height: auto; min-width: 84px; padding: 8px 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-family: var(--font-body); font-size: var(--fs-xs); }
.theme-btn svg { width: 22px; height: 22px; stroke: currentColor; }
.seg-ctl button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.drop { position: relative; border: 1.5px dashed var(--line); border-radius: 12px; padding: 18px 14px; text-align: center; color: var(--muted); font-size: var(--fs-sm); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop input[type=file] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 0; z-index: 1; }
.drop:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.msg { border-radius: 10px; padding: 10px 12px; font-size: var(--fs-sm); }
.msg.ok { background: var(--live-soft); color: var(--live); }
.msg.err { background: var(--warn-soft); color: var(--warn); }
.preview-names { display: flex; flex-wrap: wrap; gap: 6px; }
.help summary { font-weight: 600; cursor: pointer; padding-bottom: 6px; }
.help ol { margin: 0; padding-left: 1.2rem; display: flex; flex-direction: column; gap: 6px; font-size: var(--fs-sm); }
.help code { font-size: 0.85em; background: var(--bar-off); padding: 1px 5px; border-radius: 4px; }

/* Profile picker */
.picker { display: flex; flex-direction: column; gap: 14px; padding-block: 8px; }
.picker h1 { font-size: clamp(1.4rem, 7vw, 1.9rem); margin: 0; letter-spacing: -0.015em; text-wrap: balance; }
.picker p { margin: 0; color: var(--muted); }
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 9.5rem), 1fr)); gap: 8px; }
.person { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; text-align: left; min-height: 52px; }
.person .initials { width: 32px; height: 32px; border-radius: 50%; background: var(--sage); color: var(--sage-ink); display: grid; place-items: center; font-weight: 600; font-size: var(--fs-sm); flex: none; }
.person span:last-child { min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
.person[aria-current="true"] { border-color: var(--accent); }

/* Bottom nav */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
nav.tabs .wrap { display: grid; grid-template-columns: repeat(4, 1fr); height: var(--nav-h); }
nav.tabs button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: var(--fs-xs); font-weight: 500; color: var(--muted); cursor: pointer; padding: 0; }
nav.tabs svg { width: 20px; height: 20px; stroke: currentColor; }
nav.tabs button { position: relative; }
nav.tabs button[aria-current="page"] { color: var(--accent); font-weight: 600; }
nav.tabs button[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; border-radius: 0 0 3px 3px; background: var(--hl); }


/* Red days, changes */
.dayinfo { display: inline-block; font-size: var(--fs-xs); font-weight: 600; line-height: 1.3; }
.dayinfo.red { color: var(--red); }
.dayinfo.eve, .dayinfo.klam { color: var(--hl-ink); }
.eyebrow .dayinfo { font-size: inherit; }
.sec-head .dayinfo { margin-top: 2px; }
.week li.red .d-name { color: var(--red); }
.week li[data-act] { cursor: pointer; }
@media (hover: hover) { .week li[data-act]:hover { background: var(--accent-soft); } }
.week li:focus-visible { outline: 2px solid var(--hl); outline-offset: -2px; }
.d-time .lbl.changed { color: var(--hl-ink); font-weight: 600; }
.pill.changed { color: var(--warn); }
button.chip { font: inherit; font-size: var(--fs-sm); color: var(--ink); cursor: pointer; }

/* Open / close */
.oc { display: flex; flex-direction: column; gap: var(--space-inner); }
.oc-list { list-style: none; margin: 0; padding: 0; }
.oc-list li { display: grid; grid-template-columns: 4.6rem 3.4rem 1fr; align-items: baseline; gap: 8px; padding: 8px 4px; border-top: 1px solid var(--line); }
.oc-list li:last-child { border-bottom: 1px solid var(--line); }
.oc-list li.mine .oc-n { color: var(--hl-ink); font-weight: 600; }
.oc-k { font-size: var(--fs-sm); color: var(--muted); }
.oc-t { font-weight: 600; font-variant-numeric: tabular-nums; }
.oc-n { font-size: var(--fs-sm); min-width: 0; overflow-wrap: anywhere; }

/* Editor sheet */
.sheet-bg { position: fixed; inset: 0; background: rgba(23, 13, 28, 0.45); z-index: 20; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--surface); border-radius: 18px 18px 0 0; max-height: 88%; overflow-y: auto; padding-bottom: env(safe-area-inset-bottom, 0px); box-shadow: 0 -8px 30px rgba(23, 13, 28, 0.25); }
.sheet-in { display: flex; flex-direction: column; gap: 12px; padding-block: 16px 20px; }
.sheet-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.sheet-head h3 { margin: 0; font-family: var(--font-display); font-size: var(--fs-lg); }
.sheet-head .sub { color: var(--muted); font-size: var(--fs-sm); }
.wrap-ctl button { font-family: var(--font-body); font-size: var(--fs-sm); }
.time-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.time-row label, .note-l { display: flex; flex-direction: column; gap: 4px; font-size: var(--fs-sm); color: var(--muted); font-weight: 600; }
.time-row input, .note-l input { font: inherit; font-size: var(--fs-md); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px; width: 100%; min-width: 0; }
.time-row input { font-family: var(--font-mono); }
a.btn { text-decoration: none; color: var(--ink); }
.btn:disabled { opacity: 0.5; cursor: default; }

/* Progress through today's shift */
.prog { height: 6px; border-radius: 3px; background: rgba(51, 27, 63, 0.16); overflow: hidden; margin-top: 6px; }
.prog span { display: block; height: 100%; background: var(--sage-ink); border-radius: 3px; }

/* Profile picker: searchable list */
.search { font: inherit; font-size: 1rem; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; min-height: 48px; width: 100%; }
.search:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.search::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
.plist { list-style: none; margin: 0; padding: 0; border-bottom: 1px solid var(--line); }
.plist li { border-top: 1px solid var(--line); }
.prow { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 8px 8px; background: none; border: 0; text-align: left; cursor: pointer; border-radius: 10px; }
.prow .initials { width: 36px; height: 36px; border-radius: 50%; background: var(--sage); color: var(--sage-ink); display: grid; place-items: center; font-weight: 600; font-size: var(--fs-sm); flex: none; }
.prow .pn { flex: 1; min-width: 0; font-weight: 500; font-size: var(--fs-md); overflow-wrap: anywhere; }
.prow .cur-l { font-size: var(--fs-sm); color: var(--muted); }

/* Bottom sheet: grab handle, slides in, can be dragged down */
.sheet-grab { display: grid; place-items: center; height: 22px; margin-bottom: -6px; cursor: grab; touch-action: none; }
.sheet-grab span { width: 40px; height: 5px; border-radius: 3px; background: var(--line); }
.sheet { will-change: transform; overflow-x: hidden; }

/* Settings: rows that open a page each, large enough to tap */
.set-list { list-style: none; margin: 0; padding: 0; }
.set-list li + li { border-top: 1px solid var(--line); }
.set-row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 8px 2px; background: none; border: 0; text-align: left; cursor: pointer; color: inherit; font-size: var(--fs-md); border-radius: 8px; }
.set-row .sr-t { flex: 1; font-weight: 500; }
.set-row .sr-v { color: var(--muted); font-size: var(--fs-sm); max-width: 45%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.set-row svg { width: 16px; height: 16px; stroke: var(--muted); flex: none; }
.set-row:active { background: var(--accent-soft); }

    return '<ul class="oc-list"><li class="' + (me && oc.open.names.indexOf(me.name) >= 0 ? "mine" : "") + '"><span class="oc-k">Öppnar</span><span class="oc-t">' + hhmm(oc.open.min) + '</span><span class="oc-n">' + esc(namesText(oc.open.names, me)) + "</span></li>" +
      '<li class="' + (me && !oc.close.apt && oc.close.names.indexOf(me.name) >= 0 ? "mine" : "") + '"><span class="oc-k">Stänger</span><span class="oc-t">' + hhmm(oc.close.min) + '</span><span class="oc-n">' + esc(closeNames(oc.close, me)) + "</span></li></ul>";
  }

  function todayCard(me, compactView) {
    var t = today(), sh = shiftOn(me, t), st = statusFor(me, t), info = sh.closed ? null : dayInfo(t);
    var out = '<div class="eyebrow">Idag · ' + DAYS[dow(t)] + " " + (compactView ? shortDate(t) : t.getDate() + " " + MONTHS_LONG[t.getMonth()]) + (info ? ' · <span class="dayinfo ' + info.type + '">' + esc(info.name) + "</span>" : "") + "</div>";
    if (sh.kind === "work") out += '<div class="big-sub">' + sh.ranges.map(function (r) { return '<div class="big"><span class="t">' + hhmm(r.s) + '</span> <span class="sep">–</span> <span class="t">' + hhmm(r.e) + "</span></div>"; }).join("") + "</div>";
    else if (sh.kind === "note") out += '<div class="big off">' + esc(sh.label) + "</div>";
    else out += '<div class="big off">' + (sh.closed ? esc(sh.closed) : "Ledig") + "</div>";
    var live = st && st.cls === "live", now = nowMinutes();
    if (live) {
      var pc = Math.round(Math.max(0, Math.min(1, (now - st.s) / (st.e - st.s))) * 100);
      out += '<div class="prog" role="progressbar" aria-label="Del av passet som har gått" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pc + '"><span style="width:' + pc + '%"></span></div>';
    }
    // One line for what is happening now, one quiet line for the facts.
    if (st || sh.changed) {
      out += '<div class="row">';
      if (st) out += '<span class="pill ' + st.cls + '">' + st.text + (live && !compactView ? " · " + untilText(st.e - now) + " kvar" : "") + "</span>";
      if (sh.changed) out += '<span class="pill changed">Ändrat</span>';
      out += "</div>";
    }
    if (!compactView) {
      var facts = [];
      if (sh.kind === "work") facts.push(hours(workMinutes(sh)) + (sh.label ? " " + esc(sh.label) : ""));
      facts.push("Schemavecka " + (rotWeek(t) + 1) + " av " + DATA.weeks, "v.\u00a0" + isoWeek(t));
      out += '<div class="meta">' + facts.join(" · ") + "</div>";
    }
    var ex = extraOn(me, t);
    if (ex) out += '<div class="extra-line">' + esc(ex) + "</div>";
    if (sh.kind !== "work" || (st && st.cls === "done")) {
      var nx = nextShift(me, t);
      if (nx) out += '<div class="next">Nästa pass: <strong>' + (nx.i === 1 ? "imorgon" : DAYS[dow(nx.d)].toLowerCase() + " " + shortDate(nx.d)) + '</strong> <span class="mono">' + rangeText(nx.sh) + "</span></div>";
    }
    return out;
  }

  // The "Idag" button keeps its space when hidden, so the arrows never move.
  function todayBtn(act, show) {
    return '<button class="text-btn' + (show ? "" : " keep-space") + '" data-act="' + act + '"' + (show ? "" : ' tabindex="-1" aria-hidden="true"') + ">Idag</button>";
  }

  // "19–25 okt", or "26 okt–1 nov" when the week spans two months.
  function weekRange(mon, days) {
    var sun = addDays(mon, (days || 7) - 1);
    return mon.getMonth() === sun.getMonth() ? mon.getDate() + "–" + shortDate(sun) : shortDate(mon) + "–" + shortDate(sun);
  }

  // ---------- Favourite colleagues (kept per viewer in this browser) ----------
  function favPeople(me) { return state.favs.map(personByName).filter(function (p) { return p && !(me && p.name === me.name); }); }
  function isFav(n) { return state.favs.indexOf(n) >= 0; }
  function toggleFav(n) {
    var i = state.favs.indexOf(n);
    if (i >= 0) state.favs.splice(i, 1); else state.favs.push(n);
    lsSet("skift.favs", state.favs.length ? JSON.stringify(state.favs) : null);
  }

  // Week table for you and your favourites; follows the week shown above it.
  function favsHtml(me, mon) {
    var fp = favPeople(me);
    if (!fp.length) return '<section class="fav-sec" aria-label="Avdelningskollegor"><div class="sec-head"><h2>Avdelningskollegor</h2></div><p class="hint">Välj kollegor du vill se här.</p><div class="btn-row"><button class="text-btn" data-act="gofavs">Välj avdelningskollegor</button></div></section>';
    var people = (me ? [me] : []).concat(fp), t = today(), days = [];
    for (var i = 0; i < 7; i++) {
      var d = addDays(mon, i);
      if (i < 5 || people.some(function (p) { return shiftOn(p, d).kind !== "off"; })) days.push(d);
    }
    var head = "<tr><th></th>" + days.map(function (d) { return '<th class="' + (dayNum(d) === dayNum(t) ? "cur" : "") + '"><b>' + DAYS_SHORT[dow(d)] + "</b>" + d.getDate() + "</th>"; }).join("") + "</tr>";
    var body = people.map(function (p) {
      var isMe = me && p.name === me.name;
      return '<tr class="' + (isMe ? "me" : "") + '"><th>' + (isMe ? "Du" : esc(p.name)) + "</th>" + days.map(function (d) {
        var s = shiftOn(p, d), cls = dayNum(d) === dayNum(t) ? ["cur"] : [], txt;
        if (s.kind === "work") txt = "<span>" + hhmm(s.ranges[0].s) + "</span><span>" + hhmm(s.ranges[s.ranges.length - 1].e) + "</span>";
        else if (s.kind === "note") { cls.push("note"); txt = esc(s.label.length > 6 ? s.label.slice(0, 5) + "." : s.label); }
        else { cls.push("off"); txt = "–"; }
        return '<td class="' + cls.join(" ") + '" data-act="edit" data-name="' + esc(p.name) + '" data-date="' + ymd(d) + '" title="' + esc(p.name + ", " + DAYS[dow(d)] + " " + shortDate(d) + ": " + baseText(s)) + '">' + txt + "</td>";
      }).join("") + "</tr>";
    }).join("");
    return '<section class="fav-sec" aria-label="Avdelningskollegor" data-slide><div class="sec-head"><h2>Avdelningskollegor</h2></div><div class="fav-scroll"><table class="favs"><thead>' + head + "</thead><tbody>" + body + "</tbody></table></div></section>";
  }

  // Saturday and Sunday are only shown when the uploaded schedule has shifts on them.
  function hasWeekend() {
    return DATA.people.some(function (p) { return p.shifts.some(function (sh, i) { return i % 7 >= 5 && parseShift(sh).kind !== "off"; }); });
  }

  // A person's week with arrows to step between weeks. Used on Mitt schema and in a colleague's sheet.
  function weekBlock(p, offset, act, back) {
    var t = today(), mon = addDays(mondayOf(t), offset * 7), total = 0, count = 0, rows = "", weekend = hasWeekend();
    for (var i = 0; i < 7; i++) {
      var d = addDays(mon, i), s = shiftOn(p, d), isT = dayNum(d) === dayNum(t), past = dayNum(d) < dayNum(t), info = dayInfo(d);
      if (i >= 5 && !weekend && s.kind === "off") continue;
      total += workMinutes(s); if (s.kind === "work") count++;
      var tcell;
      if (s.kind === "work") tcell = '<span class="t">' + rangeText(s) + "</span>" + (s.label ? '<span class="lbl">' + esc(s.label) + "</span>" : "");
      else if (s.kind === "note") tcell = '<span class="notetxt">' + esc(s.label) + "</span>";
      else tcell = '<span class="t offtxt">' + (s.closed ? esc(s.closed) : "Ledig") + "</span>" + (s.label ? '<span class="lbl">' + esc(s.label) + "</span>" : "");
      var dx = extraOn(p, d);
      if (dx) tcell += '<span class="lbl extra">' + esc(dx) + "</span>";
      if (s.changed) tcell += '<span class="lbl changed">Ändrat · ordinarie ' + esc(baseText(s.base)) + "</span>";
      var cls = [isT ? "is-today" : past ? "is-past" : "", info ? "has-info " + info.type : ""].join(" ").trim();
      rows += '<li class="' + cls + '"' + (isT ? ' aria-current="date"' : "") + ' data-act="edit" data-name="' + esc(p.name) + '" data-date="' + ymd(d) + '"' + (back ? ' data-back="1"' : "") + ' tabindex="0" role="button" aria-label="' + esc(DAYS[i] + " " + shortDate(d) + ", ändra") + '">' +
        '<div><div class="d-name">' + DAYS_SHORT[i] + '</div><div class="d-date">' + (isT ? "Idag" : shortDate(d)) + "</div>" + (s.closed ? "" : dayLabelHtml(d)) + '</div><div class="d-time">' + tcell + '</div><div class="d-hrs">' + (s.kind === "work" ? hours(workMinutes(s)) : "") + "</div></li>";
    }
    var label = offset === 0 ? "Den här veckan" : offset === 1 ? "Nästa vecka" : offset === -1 ? "Förra veckan" : "Vecka " + isoWeek(mon);
    return '<section class="week-sec" aria-label="Veckan"><div class="sec-head"><div><h2>' + label + '</h2><div class="sub">' + weekRange(mon, weekend ? 7 : 5) + " · v.\u00a0" + isoWeek(mon) + " · schemavecka " + (rotWeek(mon) + 1) + "</div></div>" +
      '<div class="stepper">' + todayBtn(act + "0", offset !== 0) +
      '<button class="icon-btn" data-act="' + act + '" data-d="-1" aria-label="Föregående vecka">' + ICON.left + '</button><button class="icon-btn" data-act="' + act + '" data-d="1" aria-label="Nästa vecka">' + ICON.right + "</button></div></div>" +
      '<ul class="week" data-slide>' + rows + "</ul>" +
      '<div class="week-sum" data-slide><span>' + count + ' pass</span><span>Totalt <strong>' + hours(total) + "</strong></span></div></section>";
  }

  function renderHome(me, noCard) {
    var t = today();
    var out = '<div class="view">' + exampleNote();
    if (!noCard) out += '<section class="today" aria-label="Idag">' + todayCard(me, false) + "</section>";
    out += openCloseHtml(me);

    var mon = addDays(mondayOf(t), state.weekOffset * 7);
    out += weekBlock(me, state.weekOffset, "week", false);
    out += favsHtml(me, mon);

    return out + "</div>";
  }

  // ---------- Change editor (bottom sheet) ----------
  function openEditor(name, date, back) {
    var p = personByName(name); if (!p) return;
    var d = parseYmd(date), base = baseShiftOn(p, d), cur = changeFor(p, d);
    var times = cur && cur.type === "tid" ? parseShift(cur.shift) : base;
    var f = { type: cur ? cur.type : null, note: cur ? (cur.note || "") : "", start: "", end: "", err: null, busy: false };
    if (times.kind === "work") { f.start = hhmm(times.ranges[0].s); f.end = hhmm(times.ranges[times.ranges.length - 1].e); }
    state.edit = { person: name, date: date, form: f, fresh: true, back: !!back };
    render();
    var first = document.querySelector(".sheet button, .sheet input");
    if (first) first.focus();
  }

  function renderEditor(me) {
    var e = state.edit; if (!e) return "";
    var p = personByName(e.person); if (!p) return "";
    var d = parseYmd(e.date), base = baseShiftOn(p, d), cur = changeFor(p, d), eff = shiftOn(p, d), f = e.form;
    var isMe = me && me.name === p.name;
    var anim = e.fresh ? " in" : "";
    var out = '<div class="sheet-bg' + anim + '" data-act="closeedit"></div><div class="sheet' + anim + '" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="sheet-grab" aria-hidden="true"><span></span></div><div class="wrap sheet-in">' +
      '<div class="sheet-head"><div style="min-width:0"><h3 id="sheet-title">' + (isMe ? "Ditt pass" : esc(p.name)) + '</h3><div class="sub">' + DAYS[dow(d)] + " " + shortDate(d) + " · ordinarie " + esc(baseText(base)) + "</div>" + dayLabelHtml(d) + "</div>" +
      '<button class="icon-btn" data-act="closeedit" aria-label="Stäng">' + ICON.close + "</button></div>";
    if (!isMe && !e.back) out += '<div class="btn-row"><button class="text-btn" data-act="fav" data-name="' + esc(p.name) + '">' + (isFav(p.name) ? "Ta bort från avdelningskollegor" : "Lägg till som avdelningskollega") + "</button></div>";
    if (cur) out += '<div class="msg ok">Ändrat till: ' + esc(baseText(eff)) + "</div>";
    var doc = openClose(d);
    out += '<div class="group-label">På jobbet ' + DAYS[dow(d)].toLowerCase() + " " + shortDate(d) + "</div>" +
      (doc ? ocGrid(doc, me) : '<p class="hint">' + (closedDay(d) ? esc(closedDay(d)) + ", ingen arbetar." : "Ingen arbetar den här dagen.") + "</p>");

    if (dbState === "ready") {
      out += '<div class="group-label">Ändra för dagen</div><div class="seg-ctl wrap-ctl" role="group" aria-label="Typ av ändring">' +
        CHANGE_TYPES.map(function (t) { return '<button data-act="settype" data-t="' + t[0] + '" aria-pressed="' + (f.type === t[0]) + '">' + t[1] + "</button>"; }).join("") + "</div>";
      if (f.type === "tid") {
        out += '<div class="time-row"><label for="ed-start">Börjar<input id="ed-start" type="time" step="300" value="' + esc(f.start) + '"></label><label for="ed-end">Slutar<input id="ed-end" type="time" step="300" value="' + esc(f.end) + '"></label></div>';
      }
      if (f.type) out += '<label class="note-l" for="ed-note">' + (f.type === "annat" ? "Vad gäller det?" : "Kommentar (valfritt)") + '<input id="ed-note" type="text" maxlength="60" value="' + esc(f.note) + '" placeholder="' + (f.type === "annat" ? "t.ex. Kurs, Utbildning" : "t.ex. bytt med Eva") + '"></label>';
      if (f.err) out += '<div class="msg err" role="alert">' + esc(f.err) + "</div>";
      out += '<div class="btn-row"><button class="btn primary" data-act="saveedit"' + (!f.type || f.busy ? " disabled" : "") + ">" + (f.busy ? "Sparar..." : "Spara ändring") + "</button>" +
        (cur ? '<button class="btn" data-act="deledit"' + (f.busy ? " disabled" : "") + ">Ta bort ändringen</button>" : "") + "</div>" +
        "";
    } else if (dbState === "readonly") {
      out += '<div class="msg err">Du kan se ändringar men inte spara egna. Be den som delade appen att ge dig behörighet att använda den (Contributor) i stället för att bara visa den.</div>';
    } else if (dbState === "loading") {
      out += '<p class="hint">Hämtar ändringar...</p>';
    } else {
      out += '<p class="hint">Ändringar kan bara sparas när appen är öppen via claude.ai och du är inloggad.</p>';
    }
    if (eff.kind === "work") out += '<div class="btn-row"><a class="btn" href="' + esc(gcalUrl(d, eff, extraOn(p, d))) + '" target="_blank" rel="noopener">Lägg till i Google Kalender</a></div>';
    return out + "</div></div>";
  }

  function saveEdit() {
    var e = state.edit, f = e.form;
    if (!f.type) return;
    if (f.type === "tid") {
      var ok = /^\d{2}:\d{2}$/.test(f.start) && /^\d{2}:\d{2}$/.test(f.end) && f.start !== f.end;
      if (!ok) { f.err = "Fyll i när passet börjar och slutar."; render(); return; }
    }
    if (f.type === "annat" && !f.note.trim()) { f.err = "Skriv vad ändringen gäller, till exempel Kurs."; render(); return; }
    var body = { person: e.person, date: e.date, type: f.type, shift: f.type === "tid" ? f.start + "-" + f.end : "", note: f.note.trim().slice(0, 60), at: new Date().toISOString() };
    writeChange(e.person, e.date, body);
  }
  function writeChange(name, date, body) {
    var f = state.edit.form;
    f.busy = true; f.err = null; render();
    var ref = dbRef.collection("changes").doc(changeId(name, date));
    (body ? ref.set(body) : ref.delete()).then(function () {
      buzz(); closeSheet();
    }, function (err) {
      f.busy = false;
      if (err && (err.code === "invalid_argument" || err.code === "not_granted")) { dbState = "readonly"; f.err = null; }
      else if (err && err.code === "quota_exceeded") f.err = "Det finns för många sparade ändringar. Ta bort gamla ändringar och försök igen.";
      else f.err = "Ändringen kunde inte sparas. Kontrollera anslutningen och försök igen.";
      render();
    });
  }

  // ---------- Compact view for small square screens (Galaxy Z Flip cover screen) ----------
  // The cover screen is small and almost square. MultiStar can give the page a
  // larger viewport than expected, so also accept a near-square window or screen.
  function squareish(w, h) { return w > 0 && h > 0 && w / h > 0.75 && w / h < 1.34; }
  function coverScreen() {
    // The keyboard makes the window shorter while typing; that is not the cover screen.
    var ae = document.activeElement;
    if (typeof wasCover === "boolean" && ae && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)) return wasCover;
    var w = window.innerWidth, h = window.innerHeight, sw = screen.width, sh = screen.height;
    return (w <= 520 && h <= 520) || (w <= 640 && squareish(w, h)) || (sw <= 640 && squareish(sw, sh));
  }
  var wasCover = coverScreen();
  function glanceActive(me) { return !!(coverScreen() && me && !state.picking); }
  // Week card for the cover screen: this week only, just day and time, large.
  function coverWeek(me) {
    var t = today(), mon = mondayOf(t), weekend = hasWeekend(), rows = "";
    for (var i = 0; i < 7; i++) {
      var d = addDays(mon, i), s = shiftOn(me, d), isT = dayNum(d) === dayNum(t);
      if (i >= 5 && !weekend && s.kind === "off") continue;
      var txt = s.kind === "work" ? rangeText(s) : s.kind === "note" ? esc(s.label) : s.closed ? esc(s.closed) : "Ledig";
      rows += '<li class="' + (isT ? "is-today" : "") + (s.kind === "work" ? "" : " off") + '"><span class="cw-d">' + DAYS_SHORT[i] + '</span><span class="cw-t">' + txt + "</span></li>";
    }
    return '<div class="cw-head"><span class="cw-h">Den här veckan</span><span class="cw-s">v.\u00a0' + isoWeek(mon) + '</span></div><ul class="cw">' + rows + "</ul>";
  }
  // Department card for the cover screen: who works when today.
  function coverTeam(me) {
    var t = today(), fp = favPeople(me);
    var head = '<div class="cw-head"><span class="cw-h">Avdelningen idag</span></div>';
    if (!fp.length) return head + '<p class="cw-empty">Välj avdelningskollegor under Inställningar.</p>';
    return head + '<ul class="cw team">' + [me].concat(fp).map(function (p) {
      var s = shiftOn(p, t), isMe = p.name === me.name;
      var txt = s.kind === "work" ? rangeText(s) : s.kind === "note" ? esc(s.label) : s.closed ? esc(s.closed) : "Ledig";
      return '<li class="' + (isMe ? "me" : "") + (s.kind === "work" ? "" : " off") + '"><span class="cw-n">' + (isMe ? "Du" : esc(p.name)) + '</span><span class="cw-t">' + txt + "</span></li>";
    }).join("") + "</ul>";
  }

  // The cover screen: three cards to scroll between, no tabs.
  var deckPage = 0;
  function renderGlance(me) {
    var dots = [0, 1, 2].map(function (i) { return '<span class="' + (i === deckPage ? "on" : "") + '"></span>'; }).join("");
    return '<div class="deck" id="deck">' +
      '<section class="page glance" aria-label="Idag"><div class="today">' + todayCard(me, true) + "</div></section>" +
      '<section class="page" aria-label="Veckan"><div class="pcard cover-card">' + coverWeek(me) + "</div></section>" +
      '<section class="page" aria-label="Avdelningen idag"><div class="pcard cover-card">' + coverTeam(me) + "</div></section>" +
      '</div><div class="deck-dots" aria-hidden="true">' + dots + "</div>";
  }

  // Today right now: who is working, who has not started yet and who has finished.
  function renderDay(me) {
    var t = today(), now = nowMinutes(), working = [], later = [], done = [], off = [];
    DATA.people.forEach(function (p) {
      var s = shiftOn(p, t);
      if (s.kind !== "work") { off.push({ p: p, s: s }); return; }
      var cur = null, next = null;
      s.ranges.forEach(function (r) { if (now >= r.s && now < r.e) cur = r; else if (now < r.s && !next) next = r; });
      var last = s.ranges[s.ranges.length - 1];
      // The group says where they are in the day; the row shows the whole working time.
      var txt = rangeText(s);
      if (cur) working.push({ p: p, s: s, at: cur.e, txt: txt });
      else if (next) later.push({ p: p, s: s, at: next.s, txt: txt });
      else done.push({ p: p, s: s, at: last.e, txt: txt });
    });
    working.sort(function (a, b) { return a.at - b.at; });
    later.sort(function (a, b) { return a.at - b.at; });
    done.sort(function (a, b) { return b.at - a.at; });
    function group(title, list, empty) {
      return '<section class="day-sec"><div class="sec-head"><h2>' + title + ' <span class="cnt">' + list.length + "</span></h2></div>" +
        (list.length ? '<ul class="plist">' + list.map(function (x) {
          var isMe = me && x.p.name === me.name;
          return '<li><button class="prow" data-act="person" data-name="' + esc(x.p.name) + '"><span class="initials">' + initials(x.p.name) + '</span><span class="pn">' + esc(x.p.name) + (isMe ? "<small>du</small>" : "") + '</span><span class="pt">' + x.txt + "</span></button></li>";
        }).join("") + "</ul>" : '<p class="hint">' + empty + "</p>") + "</section>";
    }
    var closed = closedDay(t);
    var out = '<div class="view">' + exampleNote() +
      '<div class="sec-head"><div><h2>Dagen</h2><div class="sub">' + DAYS[dow(t)] + " " + shortDate(t) + ", klockan " + hhmm(now) + "</div></div></div>";
    if (closed) return out + '<p class="hint">' + esc(closed) + ", förskolan är stängd.</p></div>";
    if (!working.length && !later.length && !done.length) return out + '<p class="hint">Ingen jobbar idag.</p></div>';
    out += group("Jobbar nu", working, "Ingen jobbar just nu.") + group("Har inte börjat", later, "Alla har börjat.") + group("Har slutat", done, "Ingen har slutat än.");
    if (off.length) out += '<section class="day-sec"><div class="sec-head"><h2>Lediga och frånvarande <span class="cnt">' + off.length + '</span></h2></div><p class="day-off">' +
      off.map(function (x) { return esc(x.p.name) + (x.s.kind === "note" ? " (" + esc(x.s.label) + ")" : ""); }).join(", ") + "</p></section>";
    return out + "</div>";
  }

  function renderPeople(me) {
    var t = today();
    var people = DATA.people.slice().sort(function (a, b) { return a.name.localeCompare(b.name, "sv"); });
    var rows = people.map(function (p) {
      var s = shiftOn(p, t), isMe = me && me.name === p.name, txt, cls;
      if (s.kind === "work") { txt = rangeText(s); cls = "work"; }

    return { example: false, source: filename, updated: new Date().toISOString(), weeks: pick.weeks, anchor: anchor, breakMin: breakMin(), minStaff: DATA.minStaff,  people: pick.people, kind: pick.kind };
  }
  function joinWeeks(results) {
    var names = [], map = {}, xmap = {};
    results.forEach(function (r, wi) {
      r.people.forEach(function (p) {
        if (!map[p.name]) { map[p.name] = []; xmap[p.name] = []; names.push(p.name); }
        for (var d = 0; d < 7; d++) { map[p.name][wi * 7 + d] = p.shifts[d]; if (p.extras) xmap[p.name][wi * 7 + d] = p.extras[d]; }
      });
    });
    var anchor = null;
    results.forEach(function (r, wi) { if (!anchor && r.anchor) anchor = ymd(addDays(parseYmd(r.anchor), -wi * 7)); });
    return { weeks: results.length, anchor: anchor, kind: results[0].kind, people: names.map(function (n) {
      var s = [], x = [], hasX = false;
      for (var i = 0; i < results.length * 7; i++) { s.push(map[n][i] || ""); x.push(xmap[n][i] || ""); if (xmap[n][i]) hasX = true; }
      var p = { name: n, shifts: s }; if (hasX) p.extras = x;
      return p;
    }) };
  }

  // Cell texts that are not times or days off, shown so the person can check them before saving.
  function unreadNotes(data) {
    var seen = {};
    data.people.forEach(function (p) { p.shifts.forEach(function (s) { var x = parseShift(s); if (x.kind === "note") seen[x.label] = (seen[x.label] || 0) + 1; }); });
    return Object.keys(seen).sort(function (a, b) { return seen[b] - seen[a]; });
  }

  function handleFile(file) {
    state.msg = null; state.pending = null;
    if (!window.XLSX) { state.msg = { ok: false, text: "Excel-läsaren kunde inte laddas. Kontrollera internetanslutningen och försök igen." }; render(); return; }
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var bytes = new Uint8Array(reader.result), wb;
        if (/\.(csv|txt|tsv)$/i.test(file.name) || /text\//.test(file.type)) {
          // Read CSV as text so "07-16" stays a time and not a date; Excel in Sweden saves with ; and sometimes not as UTF-8.
          var str;
          try { str = new TextDecoder("utf-8", { fatal: true }).decode(bytes); } catch (e2) { str = new TextDecoder("windows-1252").decode(bytes); }
          wb = XLSX.read(str.replace(/^\ufeff/, ""), { type: "string", raw: true });
        } else wb = XLSX.read(bytes, { type: "array", cellDates: true });
        var parsed = parseWorkbook(wb, file.name);
        if (!parsed) state.msg = { ok: false, text: "Hittade inget schema i " + file.name + ". Filen behöver en rubrikrad med veckodagar (Mån, Tis, Ons ...) och namnen i en egen kolumn. Se exemplet längre ner." };
        else {
          state.pendingInfo = { kind: parsed.kind, notes: unreadNotes(parsed) };
          delete parsed.kind;
          state.pending = parsed;
        }
      } catch (e) {
        state.msg = { ok: false, text: "Filen kunde inte läsas. Spara den som .xlsx och försök igen." };
      }
      render();
    };
    reader.onerror = function () { state.msg = { ok: false, text: "Filen kunde inte öppnas. Försök igen." }; render(); };
    reader.readAsArrayBuffer(file);
  }

  // ---------- Saving ----------
  var artifactP = null;
  function getArtifact() {
    if (!artifactP) artifactP = (window.claude && window.claude.use) ? window.claude.use("artifact").catch(function () { return null; }) : Promise.resolve(null);
    return artifactP;
  }

  function saveLocal(data, why) {
    // The first schedule on this phone: go straight to choosing your name.
    if (!DATA.people.length) { state.view = "home"; state.sub = null; lsSet("skift.view", "home"); }
    lsSet("skift.local", JSON.stringify(data));
    DATA = data; LOCAL = data; usingLocal = true; shiftCache = {};
    state.pending = null; state.saving = false;
    state.msg = { ok: true, text: why };
    render();
  }

  function save(data, okText) {
    state.saving = true; render();
    getArtifact().then(function (art) {
      if (!art) { saveLocal(data, window.claude ? "Schemat är sparat på den här enheten. Öppna appen via den delade länken som ägare för att spara det åt alla." : "Schemat är sparat på den här telefonen."); return; }
      ssSet("skift.flash", JSON.stringify({ view: "settings", sub: state.sub, msg: { ok: true, text: okText } }));
      lsSet("skift.local", null);
      return art.publish(buildDocument(data)).then(function () {
        // The page reloads to the new version on its own.
      }, function (err) {
        ssTake("skift.flash");
        var code = err && err.code;
        if (code === "conflict") {
          ssSet("skift.flash", JSON.stringify({ view: "settings", sub: state.sub, msg: { ok: false, text: "Någon annan sparade samtidigt. Här är den senaste versionen, ladda upp igen om det behövs." } }));
          return;
        }
        if (code === "not_writer" || code === "not_granted" || code === "consent_required" || code === "capability_disabled" || code === "capability_removed" || code === "not_declared") {
          saveLocal(data, "Du har inte behörighet att ändra det delade schemat, så det sparades bara på den här enheten.");
          return;
        }
        saveLocal(data, "Det gick inte att spara åt alla just nu. Schemat är sparat på den här enheten, försök igen senare.");
      });
    });
  }

  // ---------- Motion and touch ----------
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  // A short vibration on Android. Some browsers block it inside embedded pages; then nothing happens.
  function buzz() { try { if (navigator.vibrate) navigator.vibrate(8); } catch (e) {} }
  function stepWeek(n) { state.weekOffset += n; slideDir = n; render(); buzz(); }

  var closing = false;
  function stepPersonWeek(n) { if (!state.person) return; state.person.week += n; slideDir = n; render(); buzz(); }
  // Closes the top sheet. An editor opened from a colleague's sheet goes back to that sheet.
  function closeSheet() {
    if ((!state.edit && !state.person) || closing) return;
    function done() { closing = false; if (state.edit) state.edit = null; else state.person = null; render(); }
    var sh = app.querySelector(".sheet"), bg = app.querySelector(".sheet-bg");
    if (reduceMotion || !sh || (state.edit && state.edit.back && state.person)) { done(); return; }
    closing = true;
    sh.style.transition = "transform 0.2s cubic-bezier(0.4, 0, 1, 1)"; sh.style.transform = "translateY(100%)";
    if (bg) { bg.style.transition = "opacity 0.2s"; bg.style.opacity = "0"; }
    setTimeout(done, 200);
  }

  // Swipe sideways to change week (Mitt schema, or in a colleague's sheet). The week follows the finger;
  // once the movement is clearly sideways the page stops scrolling up and down.
  var swipe = null;
  function swipeEls() {
    var scope = state.person ? app.querySelector(".sheet") : app.querySelector("main") || app.querySelector("#deck");
    return scope ? Array.prototype.slice.call(scope.querySelectorAll("[data-slide]")) : [];
  }
  function swipeMove(els, x, fade, ease) {
    els.forEach(function (el) {
      el.classList.remove("from-l", "from-r", "far");
      el.style.transition = ease || "none";
      el.style.transform = x ? "translateX(" + x + "px)" : "";
      el.style.opacity = fade == null ? "" : String(fade);
    });
  }
  app.addEventListener("touchstart", function (e) {
    swipe = null;
    if (e.touches.length !== 1 || state.edit || state.picking || closing) return;
    // No week swiping on the cover screen.
    if (glanceActive(state.profile && personByName(state.profile))) return;
    if (state.person ? !e.target.closest(".sheet") : state.view !== "home") return;
    if (e.target.closest("input, select, nav")) return;
    var sc = e.target.closest(".fav-scroll");
    if (sc && sc.scrollWidth > sc.clientWidth + 1) return;
    var t = e.touches[0]; swipe = { x: t.clientX, y: t.clientY, t: Date.now(), axis: null, dx: 0, els: [] };
  }, { passive: true });
  app.addEventListener("touchmove", function (e) {
    if (!swipe) return;
    var t = e.touches[0], dx = t.clientX - swipe.x, dy = t.clientY - swipe.y;
    if (!swipe.axis) {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      if (Math.abs(dx) <= Math.abs(dy)) { swipe = null; return; }
      swipe.axis = "x"; swipe.els = swipeEls();
    }
    if (e.cancelable) e.preventDefault();
    swipe.dx = dx;
    if (!reduceMotion) swipeMove(swipe.els, dx, 1 - Math.min(0.5, Math.abs(dx) / 700));
  }, { passive: false });
  // The arrows move the week out the same way a swipe does.
  function slideWeek(dir) {
    var step = function () { if (state.person) stepPersonWeek(dir); else stepWeek(dir); };
    var els = swipeEls();
    if (reduceMotion || !els.length) { step(); return; }
    swipeMove(els, -dir * window.innerWidth * 0.6, 0, "transform 0.15s ease-in, opacity 0.15s ease-in");
    setTimeout(function () { slideFar = true; step(); }, 140);
  }
  function swipeEnd() {
    if (!swipe || swipe.axis !== "x") { swipe = null; return; }
    var sw = swipe, w = window.innerWidth; swipe = null;
    var fast = Math.abs(sw.dx) > 40 && Math.abs(sw.dx) / Math.max(1, Date.now() - sw.t) > 0.4;
    if (Math.abs(sw.dx) < w * 0.25 && !fast) { swipeMove(sw.els, 0, null, "transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.22s"); return; }
    var dir = sw.dx < 0 ? 1 : -1;
    if (reduceMotion) { if (state.person) stepPersonWeek(dir); else stepWeek(dir); return; }
    // Finish the movement out of view, then bring the new week in from the other side.
    swipeMove(sw.els, -dir * w, 0, "transform 0.15s ease-in, opacity 0.15s ease-in");
    setTimeout(function () { slideFar = true; if (state.person) stepPersonWeek(dir); else stepWeek(dir); }, 140);
  }
  app.addEventListener("touchend", swipeEnd);
  // Which card of the cover screen is showing, for the dots.
  app.addEventListener("scroll", function (e) {
    if (e.target.id !== "deck") return;
    var i = Math.round(e.target.scrollTop / Math.max(1, e.target.clientHeight));
    if (i === deckPage) return;
    deckPage = i; buzz();
    app.querySelectorAll(".deck-dots span").forEach(function (d, k) { d.className = k === i ? "on" : ""; });
  }, true);
  app.addEventListener("touchcancel", function () { if (swipe && swipe.axis === "x") swipeMove(swipe.els, 0, null, "transform 0.2s"); swipe = null; });

  // Drag the sheet down to close it.
  var drag = null;
  app.addEventListener("touchstart", function (e) {
    var sh = e.target.closest(".sheet"); drag = null;
    if (!sh || closing) return;
    if (sh.scrollTop > 0 && !e.target.closest(".sheet-grab")) return;
    drag = { sh: sh, bg: app.querySelector(".sheet-bg"), x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now(), dy: 0 };
  }, { passive: true });
  app.addEventListener("touchmove", function (e) {
    if (!drag) return;
    var dy = e.touches[0].clientY - drag.y, dx = e.touches[0].clientX - drag.x;
    // Wait until the direction is clear. Upwards or sideways (a swipe to change week) is not a drag to close.
    if (!drag.dy) {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      if (dy <= 0 || Math.abs(dx) >= Math.abs(dy)) { drag = null; return; }
    }
    drag.dy = Math.max(0, dy);
    drag.sh.style.transition = "none"; drag.sh.style.transform = "translateY(" + drag.dy + "px)";
    if (drag.bg) drag.bg.style.opacity = String(Math.max(0, 1 - drag.dy / 400));
    e.preventDefault();
  }, { passive: false });
  app.addEventListener("touchend", function () {
    if (!drag) return;
    var d = drag; drag = null;
    if (!d.dy) return;
    var fast = d.dy / Math.max(1, Date.now() - d.t) > 0.5;
    if (d.dy > 110 || (fast && d.dy > 40)) { closeSheet(); return; }
    d.sh.style.transition = "transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1)"; d.sh.style.transform = "";
    if (d.bg) { d.bg.style.transition = "opacity 0.2s"; d.bg.style.opacity = ""; }
  });

  // Remember whether "Schemafil och regler" is open.

  // ---------- Events ----------
  app.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]"); if (!b) return;
    var act = b.getAttribute("data-act");
    if (act === "fav") { toggleFav(b.getAttribute("data-name")); buzz(); render(); return; }
    if (act === "sub") { state.view = "settings"; state.sub = b.getAttribute("data-s"); state.picking = false; lsSet("skift.view", "settings"); render(); window.scrollTo(0, 0); return; }
    if (act === "subback") { state.sub = null; state.msg = null; render(); window.scrollTo(0, 0); return; }
    if (act === "gofavs") { state.view = "settings"; lsSet("skift.view", "settings"); render(); var fpn = document.getElementById("fav-panel"); if (fpn) fpn.scrollIntoView(); return; }
    if (act === "go") { state.view = b.getAttribute("data-view"); state.picking = false; state.sub = null; if (state.view !== "settings") state.msg = null; lsSet("skift.view", state.view); render(); window.scrollTo(0, 0); }
    else if (act === "pick") { state.picking = true; if (state.view === "settings") state.view = "home"; render(); window.scrollTo(0, 0); }
    else if (act === "unpick") { state.picking = false; render(); }
    else if (act === "choose") { state.profile = b.getAttribute("data-name"); state.picking = false; state.pickQ = ""; lsSet("skift.profile", state.profile); buzz(); render(); window.scrollTo(0, 0); }
    else if (act === "week") { slideWeek(+b.getAttribute("data-d")); }
    else if (act === "week0") { var w0 = state.weekOffset; if (w0) stepWeek(-w0); }
    else if (act === "cancel") { state.pending = null; state.msg = null; render(); }
    else if (act === "save" && state.pending && !state.saving) { save(state.pending, "Schemat är sparat och visas nu för alla som öppnar appen."); }
    else if (act === "setweek" && !state.saving) {
      var w = +b.getAttribute("data-w");
      if (w === rotWeek(today())) return;
      var nd = JSON.parse(JSON.stringify(DATA));
      nd.anchor = ymd(addDays(mondayOf(today()), -w * 7));
      nd.updated = new Date().toISOString();
      save(nd, "Den här veckan är nu schemavecka " + (w + 1) + ".");
    }
    else if (act === "setbreak" && !state.saving) {
      var bm = +b.getAttribute("data-m");
      if (bm === breakMin()) return;
      var nb = JSON.parse(JSON.stringify(DATA));
      nb.breakMin = bm;
      nb.updated = new Date().toISOString();
      save(nb, bm ? "Rasten är nu " + bm + " minuter." : "Ingen rast dras av längre.");
    }
    else if (act === "edit") { openEditor(b.getAttribute("data-name"), b.getAttribute("data-date"), b.getAttribute("data-back") === "1"); }
    else if (act === "person") { state.person = { name: b.getAttribute("data-name"), week: 0, fresh: true }; render(); }
    else if (act === "closesheet") { closeSheet(); }
    else if (act === "pweek") { slideWeek(+b.getAttribute("data-d")); }
    else if (act === "pweek0") { if (state.person && state.person.week) stepPersonWeek(-state.person.week); }
    else if (act === "closeedit") { closeSheet(); }
    else if (act === "settype" && state.edit) { state.edit.form.type = b.getAttribute("data-t"); state.edit.form.err = null; render(); }
    else if (act === "saveedit" && state.edit && !state.edit.form.busy) { saveEdit(); }
    else if (act === "deledit" && state.edit && !state.edit.form.busy) { writeChange(state.edit.person, state.edit.date, null); }
    else if (act === "exportcal") { var mp = state.profile && personByName(state.profile); if (mp) exportCalendar(mp); }
    else if (act === "settheme") { lsSet("skift.theme", b.getAttribute("data-t") === "auto" ? null : b.getAttribute("data-t")); applyTheme(); render(); }
    else if (act === "droplocal") { lsSet("skift.local", null); LOCAL = null; DATA = EMBEDDED; usingLocal = false; shiftCache = {}; state.msg = null; render(); }
  });
  app.addEventListener("input", function (e) {
    if (e.target.id === "pick-q") { state.pickQ = e.target.value; filterPicker(state.pickQ); return; }
    if (e.target.id === "people-q") { state.peopleQ = e.target.value; filterList(state.peopleQ, "#people-list", "people-none"); return; }
    if (!state.edit) return;
    var f = state.edit.form;
    if (e.target.id === "ed-start") f.start = e.target.value;
    else if (e.target.id === "ed-end") f.end = e.target.value;
    else if (e.target.id === "ed-note") f.note = e.target.value;
  });
  app.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && (state.edit || state.person)) { closeSheet(); return; }
    if (e.key === "Enter" && e.target.id === "pick-q") {
      var vis = Array.prototype.filter.call(app.querySelectorAll(".plist li"), function (li) { return !li.hidden; });
      if (vis.length === 1) vis[0].querySelector("button").click();
      return;
    }
    if ((e.key === "Enter" || e.key === " ") && e.target.getAttribute && e.target.getAttribute("role") === "button" && e.target.hasAttribute("data-act")) { e.preventDefault(); e.target.click(); }
  });
  app.addEventListener("change", function (e) {
    if (e.target.classList && e.target.classList.contains("plan-sel")) { var v = e.target.value; writePlan(e.target.getAttribute("data-name"), v === "" ? null : +v); return; }
    if (e.target.id === "file-input" && e.target.files && e.target.files[0]) handleFile(e.target.files[0]);
  });
  app.addEventListener("dragover", function (e) { var d = e.target.closest && e.target.closest("#drop"); if (d) { e.preventDefault(); d.classList.add("over"); } });
  app.addEventListener("dragleave", function (e) { var d = e.target.closest && e.target.closest("#drop"); if (d) d.classList.remove("over"); });
  app.addEventListener("drop", function (e) {
    var d = e.target.closest && e.target.closest("#drop"); if (!d) return;
    e.preventDefault(); if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  });

  // Keep "pågår / börjar om" current.
  setInterval(function () { if (state.view !== "settings" && !state.picking && !state.edit) render(); }, 60000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden && state.view !== "settings" && !state.edit) render(); });
  // Re-check on resize (folding/unfolding); return to the card each time the cover screen comes back.
  var resizeT;
  window.addEventListener("resize", function () {
    clearTimeout(resizeT);
    resizeT = setTimeout(function () {
      var c = coverScreen();
      if (c !== wasCover) { wasCover = c; render(); }
    }, 150);
  });

  initDb();
  render();
})();
</script>

</body>
</html>
